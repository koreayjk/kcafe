<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#B7E4F7">
<link rel="icon" href="logo.png">
<title>Bahayy Cafe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* ── 브랜드 팔레트: 로고 하늘색(#B7E4F7)에서 추출 (K-Food 크림 베이스 유지) ── */
:root {
  --accent:#1D6A8E;      /* 메인 액센트 — 로고 하늘색을 진하게 (흰 배경 대비 5.9:1) */
  --accent-dark:#144F6B; /* 그라데이션 끝 */
  --accent-2:#3A90B8;    /* 막대 그래프 시작색 */
  --accent-soft:#CDEBF8; /* 액센트 배경 위 보조 글자 */
  --accent-bg:#E8F6FC;   /* 선택된 행/카드 배경 (로고 하늘색 연하게) */
  --sky:#B7E4F7;         /* 로고 배경 하늘색 */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Pretendard", "Segoe UI", sans-serif; background:#F6F2EC; color:#1E1A17; -webkit-text-size-adjust:100%; }
input, select, button { font-family: inherit; }
/* muted text darkened for AA contrast (was #807460) */
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
input:focus, select:focus, textarea:focus { border-color:var(--accent); }
.peso-field:focus-within { border-color:var(--accent); }
/* 정렬용 숫자 모노 (시스템 폰트, 외부 로딩 없음; 한글은 Pretendard로 폴백) */
/* GCash = 중립 정보(파랑) KPI 변형 */
.kpi.accent-blue { background:linear-gradient(135deg,#2563EB,#1E40AF); border:none; }
.kpi.accent-blue .kpi-label,.kpi.accent-blue .delta,.kpi.accent-blue .delta.up,.kpi.accent-blue .delta.down,.kpi.accent-blue .delta.flat { color:#C7D9F3; }
.kpi.accent-blue .kpi-value { color:#fff; }
.login-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
.login-card { background:#fff; border-radius:20px; padding:34px 30px; width:100%; max-width:390px; box-shadow:0 14px 40px rgba(110,60,30,.12); }
.login-logo-img { width:100%; max-width:260px; display:block; margin:6px auto 18px; }
.login-card h1 { text-align:center; font-size:18px; margin-bottom:4px; letter-spacing:-.3px; }
.login-card .sub { text-align:center; color:#807460; font-size:12px; margin-bottom:22px; letter-spacing:.5px; text-transform:uppercase; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
.field select, .field input { width:100%; border:1.5px solid #D8CDBD; border-radius:11px; padding:12px; font-size:15px; background:#fff; }
.err { background:#FBE4E3; color:var(--accent); padding:10px; border-radius:9px; font-size:13px; margin-bottom:14px; text-align:center; }
.setup-note { background:#FBF1DC; color:#9A6A1E; padding:14px; border-radius:11px; font-size:12.5px; line-height:1.6; margin-bottom:16px; }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:13px 20px; background:#fff; border-bottom:1px solid #E6DFD4; gap:12px; }
.topbar-logo { height:30px; }
.who { display:flex; align-items:center; gap:10px; }
.who-name { font-size:13px; font-weight:600; text-align:right; }
.who-name small { display:block; color:#807460; font-weight:500; }
.logout { border:1px solid #D8CDBD; background:#fff; border-radius:9px; padding:7px 12px; font-size:12px; cursor:pointer; color:#5E4A36; }
.tabs { display:flex; gap:2px; padding:10px 20px 0; background:#fff; border-bottom:1px solid #E6DFD4; overflow-x:auto; }
.tab { border:none; background:none; padding:10px 14px; font-size:14px; font-weight:600; color:#807460; cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap; }
.tab.on { color:var(--accent); border-bottom-color:var(--accent); }
.content { padding:20px; max-width:1080px; margin:0 auto; }
.grid-2 { display:grid; grid-template-columns:1.4fr 1fr; gap:18px; }
@media(max-width:820px){ .grid-2{ grid-template-columns:1fr; } }
.card { background:#fff; border:1px solid #E6DFD4; border-radius:16px; padding:20px; margin-bottom:18px; }
.card-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.card h2 { font-size:16px; font-weight:800; margin:0 0 14px; letter-spacing:-.3px; }
.card-head h2 { margin:0; }
.date-pill { background:#F3ECE0; color:#8E7A5E; font-size:12px; font-weight:600; padding:5px 10px; border-radius:20px; border:none; }
.muted { color:#807460; font-size:12px; }
.section-label { font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; margin:18px 0 8px; }
.menu-row { display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #F0E9DD; }
.m-name { font-weight:600; font-size:14px; }
.m-price { color:#807460; font-size:13px; }
.m-sub { font-weight:700; font-variant-numeric:tabular-nums; min-width:62px; text-align:right; color:#5E4A36; }
.stepper { display:flex; align-items:center; gap:4px; }
.stepper button { width:38px; height:38px; border:1px solid #D8CDBD; background:#fff; border-radius:8px; font-size:18px; cursor:pointer; color:#5E4A36; }
.stepper input { width:52px; text-align:center; border:1px solid #D8CDBD; border-radius:8px; padding:8px; font-size:15px; font-variant-numeric:tabular-nums; }
.exp-row { display:grid; grid-template-columns:1.2fr 100px auto; gap:8px; margin-bottom:8px; }
.exp-row select, .exp-row input { border:1px solid #D8CDBD; border-radius:8px; padding:9px 10px; font-size:13px; width:100%; }
.exp-add { border:1px solid #D8CDBD; background:#F6F2EC; border-radius:8px; width:38px; cursor:pointer; font-size:17px; color:#5E4A36; }
.sticky { align-self:start; }
.pay-input { margin-bottom:12px; }
.pay-input label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
.peso-field { display:flex; align-items:center; border:1.5px solid #D8CDBD; border-radius:10px; overflow:hidden; }
.peso-field span { padding:0 12px; color:#807460; font-weight:700; background:#F6F2EC; align-self:stretch; display:flex; align-items:center; }
.peso-field input { flex:1; border:none; padding:12px; font-size:16px; font-variant-numeric:tabular-nums; outline:none; width:100%; }
.reconcile { background:#FAF6EF; border-radius:12px; padding:14px; margin:14px 0; }
.rec-row { display:flex; justify-content:space-between; padding:5px 0; font-size:14px; }
.rec-row.big { font-size:16px; padding:12px 0; border-top:1px solid #E6DFD4; margin-top:8px; }
.rec-row b { font-variant-numeric:tabular-nums; }
.rec-flag { margin-top:8px; padding:10px 12px; border-radius:9px; font-weight:700; font-size:14px; text-align:center; }
.rec-flag.ok { background:#E3F3E8; color:#1F7A43; }
.rec-flag.bad { background:#FBE4E3; color:var(--accent); }
.rec-flag.idle { background:#F0E9DD; color:#807460; font-weight:500; }
.btn-primary { width:100%; background:var(--accent); color:#fff; border:none; padding:14px; border-radius:11px; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px; }
.btn-primary:disabled { background:#D8CDBD; cursor:not-allowed; }
.hint { font-size:12px; color:#807460; margin:10px 0 0; line-height:1.5; }
.prev-row { display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px solid #F0E9DD; }
.kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
@media(max-width:820px){ .kpi-row{ grid-template-columns:1fr; } }
.kpi { background:#fff; border:1px solid #E6DFD4; border-radius:14px; padding:18px; }
.kpi.accent { background:linear-gradient(135deg,var(--accent),var(--accent-dark)); border:none; }
.kpi-label { font-size:12px; color:#807460; margin-bottom:8px; }
.kpi.accent .kpi-label { color:var(--accent-soft); }
.kpi-value { font-size:23px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
.kpi.accent .kpi-value { color:#fff; }
.bar-row { display:grid; grid-template-columns:92px 1fr auto; align-items:center; gap:10px; margin-bottom:11px; }
.bar-name { font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; }
.bar-track { background:#F0E9DD; border-radius:6px; height:13px; overflow:hidden; }
.bar-fill { background:linear-gradient(90deg,var(--accent-2),var(--accent)); height:100%; }
.bar-val { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:66px; text-align:right; }
.badge { font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; }
.data-table { width:100%; border-collapse:collapse; font-size:13px; }
.data-table th { text-align:left; color:#807460; font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:8px 6px; border-bottom:2px solid #E6DFD4; }
.data-table th small { display:block; font-weight:500; text-transform:none; letter-spacing:0; color:#BDB2A0; }
.data-table td { padding:9px 6px; border-bottom:1px solid #F0E9DD; }
.tscroll { overflow:auto; max-height:76vh; -webkit-overflow-scrolling:touch; }
.tscroll thead th { position:sticky; top:0; background:#fff; z-index:2; }
.data-table .num { text-align:right; font-variant-numeric:tabular-nums; }
.data-table .pos { color:#1F7A43; }
.data-table .neg { color:var(--accent); }
.empty { color:#807460; text-align:center; padding:18px; }
.tag-due { background:#FBE4E3; color:var(--accent); padding:2px 8px; border-radius:6px; font-weight:700; }
.formula { margin-top:14px; background:#FAF6EF; border-radius:10px; padding:12px 14px; font-size:13px; color:#5E4A36; line-height:1.6; }
.order-card { border:1px solid #E6DFD4; border-radius:12px; padding:14px; margin-bottom:12px; }
.order-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.order-items { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.chip { background:#F3ECE0; color:#5E4A36; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; }
.order-foot { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#5E4A36; gap:8px; flex-wrap:wrap; }
.status { font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }
.s-CONFIRMED { background:#E8EEF6; color:#3A5A82; }
.s-SHIPPING { background:#FBF1DC; color:#9A6A1E; }
.s-DELIVERED { background:#E3F3E8; color:#1F7A43; }
.btn-mini { border:1px solid var(--accent); color:var(--accent); background:#fff; border-radius:8px; padding:9px 12px; font-size:12px; font-weight:700; cursor:pointer; }
.done-mark { color:#1F7A43; font-weight:700; font-size:13px; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1E1A17; color:#fff; padding:13px 22px; border-radius:30px; font-size:14px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:99; }
.loading { text-align:center; padding:40px; color:#807460; }
.report-pl .pl-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #F0E9DD; font-size:14px; }
.report-pl .pl-row.total { border-top:2px solid #E6DFD4; border-bottom:none; font-weight:800; font-size:17px; padding-top:13px; margin-top:4px; }
.report-pl b { font-variant-numeric:tabular-nums; }
.filter-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.filter-bar select, .filter-bar input { border:1px solid #D8CDBD; border-radius:9px; padding:8px 10px; font-size:13px; }
.scroll-list { max-height:none; }
.kpi-row.four { grid-template-columns:repeat(4,1fr); }
@media(max-width:820px){ .kpi-row.four{ grid-template-columns:repeat(2,1fr); } }
.kpi .delta { font-size:12px; font-weight:700; margin-top:5px; }
.kpi.accent .delta { color:var(--accent-soft); }
.delta.up{ color:#1F7A43; } .delta.down{ color:var(--accent); } .delta.flat{ color:#807460; }
.kpi.accent .delta.up,.kpi.accent .delta.down,.kpi.accent .delta.flat{ color:var(--accent-soft); }
.report-title { font-size:18px; font-weight:800; margin:2px 0 16px; letter-spacing:-.3px; }
.report-title span { color:#807460; font-weight:600; font-size:14px; }
.ebar-row { display:grid; grid-template-columns:110px 1fr auto; align-items:center; gap:10px; margin-bottom:10px; }
.ebar-name { font-size:13px; font-weight:600; }
.ebar-track { background:#F0E9DD; border-radius:6px; height:12px; overflow:hidden; }
.ebar-fill { background:linear-gradient(90deg,#E0A93F,#C9842A); height:100%; }
.ebar-val { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:66px; text-align:right; }
.pl-sub { padding-left:14px; color:#807460; font-size:13px; }
.legend { display:flex; gap:18px; margin-bottom:6px; }
.legend span { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#5E4A36; }
.legend i { width:11px; height:11px; border-radius:3px; display:inline-block; }
.minibar { display:inline-block; height:8px; border-radius:4px; background:linear-gradient(90deg,var(--accent-2),var(--accent)); vertical-align:middle; margin-right:6px; }
.m-en { display:block; font-size:11px; color:#807460; font-weight:500; font-style:normal; }
.add-form { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
.add-form input, .add-form select { border:1px solid #D8CDBD; border-radius:8px; padding:9px 10px; font-size:13px; }
.add-form input { flex:1; min-width:80px; }
.mng-row { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #F0E9DD; font-size:14px; }
.mng-price { font-weight:700; font-variant-numeric:tabular-nums; color:#5E4A36; }
.mng-del { border:1px solid #E0C0BE; color:var(--accent); background:#fff; border-radius:7px; padding:5px 10px; font-size:12px; font-weight:600; cursor:pointer; }
.lang-toggle { display:flex; gap:4px; }
.lang-toggle button { border:1px solid #D8CDBD; background:#fff; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; color:#807460; cursor:pointer; white-space:nowrap; }
.lang-toggle button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.lang-sub { display:block; font-size:11px; color:#807460; font-weight:500; font-style:italic; margin-top:1px; }
.btn-primary .lang-sub { color:var(--accent-soft); font-weight:600; }
.update-stamp { font-size:12.5px; color:#807460; font-weight:600; margin:0 0 16px; }
.update-stamp b { color:#5E4A36; }
.mng-row.editable { grid-template-columns:1fr 96px auto; }
.mng-price-input { width:96px; text-align:right; border:1px solid #D8CDBD; border-radius:7px; padding:6px 8px; font-size:13px; font-variant-numeric:tabular-nums; }
.legend.multi { flex-wrap:wrap; gap:8px 16px; }
/* ── Bahay Cafe 추가 ── */
.wordmark { text-align:center; margin:6px 0 18px; }
.wordmark b { display:block; font-size:28px; font-weight:800; letter-spacing:-.6px; color:var(--accent); }
.wordmark small { display:block; font-size:11px; color:#807460; letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
.topbar-mark { font-size:17px; font-weight:800; color:var(--accent); letter-spacing:-.4px; white-space:nowrap; }
.tab { min-height:44px; }
.logout, .lang-toggle button, .btn-mini, .mng-del { min-height:36px; }
.kpi.alert { border-color:#E0A9A6; background:#FDF3F2; }
.kpi.alert .kpi-value { color:#B5322E; }
.kpi .kpi-sub { font-size:12px; color:#5E4A36; margin-top:6px; line-height:1.5; }
.dot-red { display:inline-block; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:#B5322E; color:#fff; font-size:11px; font-weight:700; line-height:18px; text-align:center; margin-left:5px; vertical-align:1px; }
.feed-row { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #F0E9DD; font-size:14px; }
.feed-row:last-child { border-bottom:none; }
.feed-row .muted { white-space:nowrap; }
.soon { border:1.5px dashed #D8CDBD; border-radius:14px; padding:22px; text-align:center; color:#5E4A36; line-height:1.7; }
.soon b { color:var(--accent); }
.emp-row { display:grid; grid-template-columns:1fr 96px 84px auto; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid #F0E9DD; font-size:13px; }
.emp-row select, .emp-row input { border:1px solid #D8CDBD; border-radius:7px; padding:7px 8px; font-size:13px; width:100%; }
.emp-row.off { opacity:.55; }
@media(max-width:560px){ .emp-row{ grid-template-columns:1fr 1fr; } }
.badge.admin { background:var(--accent-bg); color:var(--accent); }
.badge.staff { background:#E8EEF6; color:#3A5A82; }
.s-PENDING { background:#F0E9DD; color:#8E7A5E; }
.s-APPROVED { background:var(--accent-bg); color:var(--accent); }
.s-REJECTED { background:#FBE4E3; color:#B5322E; }
@media(max-width:560px){ .topbar{ flex-wrap:wrap; padding:10px 16px; } .who{ width:100%; justify-content:space-between; } .content{ padding:16px; } }
.cam-wrap { background:#1E1A17; border-radius:14px; overflow:hidden; margin-bottom:12px; aspect-ratio:4/3; }
.cam-wrap video, .cam-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
.cam-wrap video { transform:scaleX(-1); }
.btn-ghost { width:100%; background:#fff; color:#5E4A36; border:1.5px solid #D8CDBD; padding:13px; border-radius:11px; font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }
.clock-state { font-size:22px; font-weight:800; letter-spacing:-.4px; margin-bottom:4px; }
.clock-state.on { color:#1F7A43; }
.clock-sub { color:#5E4A36; font-size:14px; margin-bottom:14px; line-height:1.6; }
.gps-line { padding:10px 12px; border-radius:10px; font-size:14px; font-weight:600; margin-bottom:6px; background:#F0E9DD; color:#5E4A36; }
.gps-line.ok { background:#E3F3E8; color:#1F7A43; }
.gps-line.warn { background:#FBF1DC; color:#9A6A1E; }
.att-table td { vertical-align:top; min-width:118px; }
.att-table td:first-child, .att-table th:first-child { min-width:64px; position:sticky; left:0; background:#fff; z-index:1; }
.att-table thead th:first-child { z-index:3; }
.shift { font-size:12px; line-height:1.5; padding:4px 6px; border-radius:7px; margin-bottom:4px; background:#E3F3E8; }
.shift.warn { background:#FBF1DC; }
.shift.open { outline:1.5px dashed #9A6A1E; }
.shift b { font-size:13px; }
.photo-btn { border:1px solid #D8CDBD; background:#fff; border-radius:6px; padding:2px 6px; font-size:12px; cursor:pointer; min-height:26px; }
.att-total td { font-weight:700; border-top:2px solid #E6DFD4; background:#FAF6EF; }
.modal { position:fixed; inset:0; background:rgba(20,15,10,.82); display:grid; place-items:center; z-index:100; padding:16px; }
.modal img { max-width:100%; max-height:80vh; border-radius:12px; display:block; }
.modal .modal-cap { color:#fff; text-align:center; margin-top:10px; font-size:14px; }
.fchips { display:flex; gap:6px; overflow-x:auto; margin:12px 0; padding-bottom:2px; }
.fchip { border:1px solid #D8CDBD; background:#fff; border-radius:20px; padding:8px 14px; font-size:13px; font-weight:600; color:#5E4A36; cursor:pointer; white-space:nowrap; min-height:38px; }
.fchip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.note-item { display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid #F0E9DD; padding:12px 2px; cursor:pointer; font:inherit; color:inherit; }
.note-item:last-child { border-bottom:none; }
.note-item.done .note-title { color:#807460; }
.note-top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.note-title { font-weight:700; font-size:15px; margin:6px 0 3px; }
.note-meta { font-size:12px; color:#807460; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cat { font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; background:#F0E9DD; color:#5E4A36; white-space:nowrap; }
.cat-REQUEST { background:#E8EEF6; color:#3A5A82; }
.cat-ISSUE { background:#FBE4E3; color:#B5322E; }
.cat-FIX { background:#FBF1DC; color:#9A6A1E; }

};
function tt(k){ const e=I18N[k]; if(!e) return k; return state.lang==="ko" ? (e.ko??k) : (e.en??k); }
function tl(k){ const e=I18N[k]; if(!e) return k; if(state.lang==="ko") return e.ko??k; return (e.en??k)+(e.tl?`<span class="lang-sub">${e.tl}</span>`:""); }
function langButtons(){ return [["ko","한국어"],["en","English · Tagalog"]].map(([k,l])=>`<button class="${state.lang===k?'on':''}" onclick="setLang('${k}')">${l}</button>`).join(""); }
function setLang(l){ state.lang=l; localStorage.setItem("cafe_lang",l); if(state.user) renderApp(); else renderLogin(); }
const empName = (e) => !e ? "" : (state.lang==="ko" ? e.name : (e.name_en || e.name));
const empById = (id) => state.employees.find((e) => String(e.id) === String(id));
const isAdmin = () => state.user?.role === "ADMIN";

function logoHTML(big){
  if (LOGO) return big ? `<img class="login-logo-img" src="${LOGO}" alt="Bahayy Cafe"><div class="sub">${tl("system_name")}</div>` : `<img class="topbar-logo" src="${LOGO}" alt="Bahayy Cafe">`;
  return big ? `<div class="wordmark"><b>☕ Bahayy Cafe</b><small>${tl("system_name")}</small></div>` : `<span class="topbar-mark">☕ Bahayy Cafe</span>`;
}
function setupError(msg, e){
  const hint = /schema/i.test(e?.message||"") ? `<br><br>👉 Supabase → Settings → API → <b>Exposed schemas</b> 에 <b>cafe</b>, <b>kfr</b> 가 모두 있는지 확인하세요.` : "";
  $("root").innerHTML = `<div class="login-wrap"><div class="login-card">${logoHTML(true)}<div class="setup-note">${msg}${hint}<br><br>오류: ${esc(e?.message||e)}</div></div></div>`;
}

async function init() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: SUPABASE_SCHEMA } });
  sbk = sb.schema(SHARED_SCHEMA);
  try {
    await loadEmployees();
    await loadSettings();
  } catch (e) {
    setupError("DB 연결은 됐지만 cafe 테이블을 읽지 못했어요. Supabase SQL Editor 에서 <b>supabase/cafe_schema.sql</b> 을 실행했는지 확인해주세요.", e);
    return;
  }
  // 새로고침해도 로그인 유지 (직원 폰 편의). 비활성/삭제된 계정이면 다시 로그인.
  const saved = empById(localStorage.getItem("cafe_user"));
  if (saved && saved.active !== false) { setUser(saved); renderApp(); }
  else renderLogin();
}
async function loadEmployees(){
  // PIN 은 로그인 순간에만 조회 (목록에는 싣지 않음)
  let { data, error } = await sb.from("employees").select("id,name,name_en,role,active,daily_rate,std_hours,shift_start,shift_end,break_min").order("id");
  if (error) ({ data, error } = await sb.from("employees").select("id,name,name_en,role,active").order("id")); // 08 SQL 실행 전
  if (error) throw error;
  state.employees = data || [];
}
async function loadSettings(){
  const { data, error } = await sb.from("app_settings").select("key,value");
  if (error) throw error;
  state.settings = Object.fromEntries((data||[]).map((r) => [r.key, r.value]));
}
async function setSetting(key, value){
  state.settings[key] = value;
  return sb.from("app_settings").upsert({ key, value: String(value) });
}
function toast(msg) { const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

// ── 로그인 ──────────────────────────────────────
function renderLogin() {
  const last = localStorage.getItem("cafe_last_emp");
  const opts = state.employees.filter((e) => e.active !== false)
    .map((e) => `<option value="${e.id}" ${String(e.id)===last?"selected":""}>${esc(empName(e))} · ${tt("role_"+e.role)}</option>`).join("");
  $("root").innerHTML = `<div class="login-wrap"><div class="login-card">
    ${logoHTML(true)}
    <div class="lang-toggle" style="justify-content:center;margin-bottom:18px">${langButtons()}</div>
    <div id="loginErr"></div>
    <div class="field"><label for="loginEmp">${tl("employee")}</label><select id="loginEmp">${opts}</select></div>
    <div class="field"><label for="loginPin">${tl("pin")}</label><input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div>
    <button class="btn-primary" onclick="doLogin()">${tl("login")}</button>
  </div></div>`;
  $("loginPin").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
}
async function doLogin() {
  const id = Number($("loginEmp").value), pin = $("loginPin").value.trim();
  const { data, error } = await sb.from("employees").select("id,name,name_en,role,active,pin").eq("id", id).single();
  if (error || !data || data.active === false) { $("loginErr").innerHTML = `<div class="err">${tt("err_no_account")}</div>`; return; }
  if (String(data.pin) !== pin) { $("loginErr").innerHTML = `<div class="err">${tt("err_bad_pin")}</div>`; return; }
  localStorage.setItem("cafe_last_emp", String(id));
  localStorage.setItem("cafe_user", String(id));
  setUser(data);
  renderApp();
}
function setUser(e){
  state.user = { id: e.id, name: e.name, name_en: e.name_en, role: e.role };
  state.tab = tabsFor().some(([k]) => k === state.tab) ? state.tab : tabsFor()[0][0];
}
function logout() { state.user = null; state.tab = null; localStorage.removeItem("cafe_user"); renderLogin(); }

// ── 탭 라우팅 (role 로 분기) ─────────────────────
function tabsFor(){
  if (isAdmin()) return ["dashboard","closing","daily","menurank","report","attendance","payroll","inventory","supply","board","manage"].map((k)=>[k,tt("tab_"+k)]);
  const t = ["clock","inventory","board"];
  if (state.settings.staff_closing === "1") t.push("closing");
  return t.map((k)=>[k,tt("tab_"+k)]);
}
function renderApp() {
  const u = state.user;
  $("root").innerHTML = `
    <div class="topbar">
      ${logoHTML(false)}
      <div class="who"><div class="lang-toggle">${langButtons()}</div>
        <div class="who-name">${esc(empName(u))}<small>${tt("role_"+u.role)}</small></div>
        <button class="logout" onclick="logout()">${tt("logout")}</button></div>
    </div>
    <nav class="tabs" role="tablist">${tabsFor().map(([k,l])=>`<button id="tab_${k}" class="tab ${state.tab===k?'on':''}" role="tab" aria-selected="${state.tab===k}" onclick="go('${k}')">${l}</button>`).join("")}</nav>
    <main class="content" id="screen"><div class="loading">${tt("loading")}</div></main>`;
  renderScreen();
  refreshBoardBadge();
  if (isAdmin()) purgeOldPhotos(false);
}
function go(t) { resetCam(); if (t === "board") { board.mode = "list"; board.id = null; } state.tab = t; renderApp(); }
const SCREENS = {
  dashboard: () => screenDashboard(),
  manage:    () => screenManage(),
  clock:      () => screenClock(),
  attendance: () => screenAttendance(),
  payroll:    () => screenPayroll(),
  board:      () => screenBoard(),
  inventory:  () => screenInventory(),
  supply:     () => screenSupply(),
  closing:    () => screenClosing(),
  daily:      () => screenDaily(),
  menurank:   () => screenMenuRank(),
  report:     () => screenReport(),
};
async function renderScreen() {
  try { await (SCREENS[state.tab] || SCREENS[tabsFor()[0][0]])(); }
  catch (e) { $("screen").innerHTML = `<div class="err">${esc(e.message||e)}</div>`; }
}

// ── 대시보드 (사장 첫 화면) ──────────────────────
async function screenDashboard(){
  const d = today(), since = new Date(Date.now() - 7*864e5).toISOString();
  const [att, inv, notes, open, close, sup, unread] = await Promise.all([
    sb.from("attendance").select("id,employee_id,date,clock_in,clock_out,photo_path,distance_m,out_distance_m,accuracy_m,verified").eq("date", d),
    sb.from("inventory_items").select("id,name,name_en,unit,stock,reorder_level").eq("active", true),
    sb.from("notes").select("id,title,category,author_employee_id,last_activity_at,last_activity_by,resolved,photo_path,note_comments(count)")
      .gte("last_activity_at", since).order("last_activity_at", { ascending:false }).limit(15),
    sb.from("notes").select("id", { count:"exact", head:true }).eq("resolved", false),
    sb.from("closings").select("cash,gcash,card").eq("date", d).maybeSingle(),
    sbk.from("supply_requests").select("id", { count:"exact", head:true }).eq("source","CAFE").eq("status","PENDING"),
    unreadNoteIds(),
  ]);
  const reqs = await sbk.from("supply_requests").select("id,items,status,requested_by,created_at,status_at,received_at").eq("source","CAFE").gte("status_at", since).order("id", { ascending:false }).limit(10);
  const [checks, cleans] = await Promise.all([
    sb.from("stock_checks").select("date,item_id,diff,employee_id,created_at").gte("date", addDays(d, -6)),
    att.data?.length ? sb.from("clean_photos").select("attendance_id,area").in("attendance_id", att.data.map((a) => a.id)) : Promise.resolve({ data: [] }),
  ]);
  const cleanN = {}; (cleans.data||[]).forEach((c) => (cleanN[c.attendance_id] ||= new Set()).add(c.area));
  const itemNm = (id) => itemName((inv.data||[]).find((i) => i.id === id)) || `#${id}`;
  const attRows = att.data || []; attRows.forEach((r) => photoRows.set(r.id, r));
  const working = attRows.filter((a) => a.clock_in && !a.clock_out);
  const low = (inv.data||[]).filter((i) => Number(i.stock) < Number(i.reorder_level));
  const sales = close.data ? closingTotal(close.data) : null;
  const ko = state.lang === "ko";
  const workingTxt = working.map((a) => `${esc(empName(empById(a.employee_id)))} ${timeHM(a.clock_in)}${a.verified?" ✅":" ⚠️"}`).join("<br>");
  const lowTxt = low.slice(0,4).map((i) => `${esc(ko?i.name:(i.name_en||i.name))} ${Number(i.stock)}/${Number(i.reorder_level)}${esc(i.unit||"")}`).join("<br>");
  const supErr = sup.error ? `<div class="setup-note">⚠️ K-Food 공용 테이블(kfr.supply_requests)을 읽지 못했어요: ${esc(sup.error.message)}</div>` : "";
  // 현장 피드: 게시글/댓글 + 오늘 출퇴근을 시간순으로 한 줄에
  const events = [];
  (notes.data||[]).forEach((n) => {
    const cnt = n.note_comments?.[0]?.count || 0, commented = cnt && String(n.last_activity_by) !== String(n.author_employee_id);
    events.push({ t: n.last_activity_at, html: `<button class="feed-row feed-btn" onclick="openNote(${n.id})">
      <span class="feed-ico">${commented ? "💬" : "📝"}</span>
      <div class="feed-main"><div>${catBadge(n.category)} <b>${esc(n.title || (ko?"(제목 없음)":"(no title)"))}</b>${unread.has(n.id) ? `<span class="dot-red">N</span>` : ""}${n.resolved ? ` <span class="done-mark">✓</span>` : ""}</div>
      <div class="muted">${esc(empName(empById(commented ? n.last_activity_by : n.author_employee_id)))}${commented ? (ko?" 댓글":" commented") : ""}${n.photo_path ? " · 📷" : ""}${cnt ? ` · 💬 ${cnt}` : ""}</div></div>
      <span class="muted">${ago(n.last_activity_at)}</span></button>` });
  });
  attRows.forEach((a) => {
    const who = esc(empName(empById(a.employee_id)));
    events.push({ t: a.clock_in, html: `<div class="feed-row"><span class="feed-ico">🟢</span>
      <div class="feed-main"><b>${who}</b> ${ko?"출근":"clocked in"} ${timeHM(a.clock_in)} · ${distTxt(a.distance_m)} ${a.verified?"✅":"⚠️"}
      ${a.photo_path ? ` <button class="photo-btn" aria-label="photo" onclick="showPhoto(${a.id})">📷</button>` : ""}</div><span class="muted">${ago(a.clock_in)}</span></div>` });
    const cn = cleanN[a.id]?.size || 0;
    if (a.clock_out) events.push({ t: a.clock_out, html: `<div class="feed-row"><span class="feed-ico">⚪</span>
      <div class="feed-main"><b>${who}</b> ${ko?"퇴근":"clocked out"} ${timeHM(a.clock_out)} · ${fmtDur(durMin(a.clock_in, a.clock_out))}
      ${cn ? ` <button class="photo-btn" onclick="showCleanPhotos(${a.id})">🧹 ${cn}/4</button>` : cleans.error ? "" : ` <span class="tag-due">🧹 0/4</span>`}</div><span class="muted">${ago(a.clock_out)}</span></div>` });
  });
  (reqs.data||[]).forEach((r) => { const t = r.status_at || r.created_at, toRecv = r.status === "DELIVERED" && !r.received_at;
    events.push({ t, html: `<button class="feed-row feed-btn" onclick="go('${toRecv ? "inventory" : "supply"}')"><span class="feed-ico">${r.status==="DELIVERED" ? "🚚" : "📦"}</span>
    <div class="feed-main"><div><b>${esc(personName(r.requested_by))}</b> ${ko?"주문요청":"request"} ${supBadge(r.status)}${toRecv ? ` <span class="dot-red">${ko?"입고 대기":"to receive"}</span>` : ""}</div><div class="muted">${reqItemsTxt(r.items)}</div></div>
    <span class="muted">${ago(t)}</span></button>` }); });
  const byDay = {}; (checks.data||[]).forEach((c) => (byDay[c.date] ||= []).push(c));
  Object.entries(byDay).forEach(([day, list]) => { const bad = list.filter((c) => Number(c.diff) !== 0), t = list.map((c) => c.created_at).sort().pop();
    events.push({ t, html: `<button class="feed-row feed-btn" onclick="go('inventory')"><span class="feed-ico">📋</span>
      <div class="feed-main"><div><b>${esc(empName(empById(list[0].employee_id)))}</b> ${ko?"재고 확인":"stock count"} ${bad.length ? `<span class="tag-due">${ko?`불일치 ${bad.length}`:`${bad.length} off`}</span>` : `<span class="done-mark">✓</span>`}</div>
      ${bad.length ? `<div class="muted">${bad.map((c) => `${esc(itemNm(c.item_id))} ${Number(c.diff)>0?"+":""}${qtyFmt(c.diff)}`).join(", ")}</div>` : ""}</div><span class="muted">${ago(t)}</span></button>` }); });
  events.sort((a, b) => new Date(b.t) - new Date(a.t));
  const pp = (() => { const c = currentPeriod(); return payPeriod(c.month, c.half); })();
  $("screen").innerHTML = `<div class="report-title">${ko?"오늘의 매장":"Today at the cafe"} <span>· ${d}</span></div>
    ${supErr}
    ${d === pp.end ? `<button class="payday" onclick="pay.month=null;go('payroll')">💸 ${ko?`오늘은 급여일입니다 (${pp.start.slice(5)} ~ ${pp.end.slice(5)}) — 급여 확인하기`:`Pay day today (${pp.start.slice(5)} – ${pp.end.slice(5)}) — open payroll`} →</button>` : ""}
    <div class="kpi-row four">
      <div class="kpi accent" role="button" tabindex="0" style="cursor:pointer" onclick="openClosing(today())"><div class="kpi-label">${ko?"오늘 매출":"Today's sales"}</div><div class="kpi-value">${sales===null?"—":fmt(sales)}</div><div class="delta flat">${sales===null?(ko?"마감 전":"Not closed yet"):(ko?"마감 완료":"Closed")}</div></div>
      <div class="kpi"><div class="kpi-label">${ko?"근무 중":"Working now"}</div><div class="kpi-value">${working.length}</div><div class="kpi-sub">${workingTxt}</div></div>
      <div class="kpi ${low.length?"alert":""}"><div class="kpi-label">${ko?"저재고":"Low stock"}</div><div class="kpi-value">${low.length}</div><div class="kpi-sub">${lowTxt}</div></div>
      <div class="kpi ${sup.count?"alert":""}"><div class="kpi-label">${ko?"승인 대기":"Pending approval"}</div><div class="kpi-value">${sup.error?"—":(sup.count||0)}</div><div class="kpi-sub">${ko?"☕ 공급요청":"☕ Supply requests"}</div></div>
    </div>
    <div class="card"><div class="card-head"><h2>${ko?"현장 피드":"Live feed"}${unread.size?`<span class="dot-red">${unread.size}</span>`:""}</h2>
      <div style="display:flex;gap:8px;align-items:center">${open.count ? `<span class="muted">${ko?"미해결":"Open"} ${open.count}</span>` : ""}<button class="btn-mini" onclick="go('board')">${tt("tab_board")} →</button></div></div>
      ${events.slice(0, 20).map((e) => e.html).join("") || `<p class="empty">${ko?"최근 7일간 소식이 없습니다.":"Nothing in the last 7 days."}</p>`}</div>`;
}

}

const cam = { stream:null, blob:null, url:null, pos:null, posErr:null, posPromise:null };
function stopCamera(){ if (cam.stream) { cam.stream.getTracks().forEach((t) => t.stop()); cam.stream = null; } }
function resetCam(){ stopCamera(); if (cam.url) URL.revokeObjectURL(cam.url); Object.assign(cam, { blob:null, url:null, pos:null, posErr:null, posPromise:null }); }
const durMin = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
const fmtDur = (m) => `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`;
function storeDistance(lat, lng){
  const s = state.settings; if (!s.store_lat || !s.store_lng) return null;
  const R = 6371000, rad = (x) => x * Math.PI / 180, la1 = rad(lat), la2 = rad(Number(s.store_lat));
  const h = Math.sin((la2-la1)/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(rad(Number(s.store_lng)-lng)/2)**2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
const distTxt = (d) => d == null ? "📍 —" : `📍 ${d}m`;

  if (error) throw error;
  return data?.[0] || null;

async function startClockIn(){
  const box = $("camBox");
  if (!navigator.mediaDevices?.getUserMedia) { box.innerHTML = `<div class="err">${tt("cam_unsupported")}</div>`; return; }
  stopCamera();
  // GPS 는 카메라와 동시에 요청 (촬영하는 동안 위치 확보)
  cam.pos = null; cam.posErr = null;
  cam.posPromise = getPosition().then((p) => { cam.pos = p.coords; }).catch((e) => { cam.posErr = e; }).finally(updateGpsLine);
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ ideal:960 }, height:{ ideal:720 } }, audio:false });
  } catch (e) {
    box.innerHTML = `<div class="err">${tt("cam_denied")}</div><button class="btn-ghost" onclick="screenClock()">${tt("cancel")}</button>`; return;
  }
  box.innerHTML = `<div class="cam-wrap"><video id="camVideo" playsinline muted autoplay></video></div>
    <div id="gpsLine" class="gps-line"></div>
    <button class="btn-primary" onclick="capturePhoto()">📸 ${tl("take_photo")}</button>
    <button class="btn-ghost" onclick="screenClock()">${tt("cancel")}</button>`;
  updateGpsLine();
  const v = $("camVideo"); v.srcObject = cam.stream; v.play().catch(() => {});
}
function capturePhoto(){
  const v = $("camVideo"); if (!v || !v.videoWidth) return;
  // 640px · JPEG 60% 로 압축 (용량·egress 절약)
  const scale = Math.min(1, 640 / v.videoWidth), c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  c.toBlob((b) => {
    if (!b) return;
    stopCamera();
    if (cam.url) URL.revokeObjectURL(cam.url);
    cam.blob = b; cam.url = URL.createObjectURL(b);
    $("camBox").innerHTML = `<div class="cam-wrap"><img src="${cam.url}" alt=""></div>
      <div id="gpsLine" class="gps-line"></div>
      <button class="btn-primary" id="confirmIn" onclick="confirmClockIn()">✅ ${tl("clock_in")}</button>
      <button class="btn-ghost" onclick="startClockIn()">↺ ${tt("retake")}</button>`;
    updateGpsLine();
  }, "image/jpeg", 0.6);
}
function updateGpsLine(){
  const el = $("gpsLine"); if (!el) return;
  if (cam.pos) {
    const d = storeDistance(cam.pos.latitude, cam.pos.longitude), fence = Number(state.settings.geofence_m || 100);
    if (d == null) { el.className = "gps-line"; el.textContent = tt("gps_no_store"); return; }
    const ok = d <= fence;
    el.className = "gps-line " + (ok ? "ok" : "warn");
    el.textContent = `📍 ${state.lang==="ko" ? "매장까지" : "Store"} ${d}m (±${Math.round(cam.pos.accuracy)}m) ${ok ? "✅" : "⚠️"}`;
  } else if (cam.posErr) { el.className = "gps-line warn"; el.textContent = tt("gps_fail"); }
  else { el.className = "gps-line"; el.textContent = tt("gps_checking"); }
}

// 사진: 긴 변 1024px · JPEG 70% 로 줄여서 업로드
function compressImage(file, max = 1024, quality = 0.7){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve(b) : reject(new Error("image")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(state.lang==="ko" ? "이미지를 읽을 수 없어요" : "Can't read image")); };
    img.src = url;
  });
}

const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return x.toLocaleDateString("en-CA"); };

// ── 퇴근 전 재고 확인: 예상(현재고 = 판매 차감 반영) vs 실제 개수 ──
function dailyCheckHTML(items, checks, closedToday, missingTable){
  const ko = state.lang === "ko", d0 = today(), list = items.filter((i) => i.daily_check);
  if (missingTable || !list.length) return "";
  const todays = checks.filter((c) => c.date === d0), lastBy = {};
  todays.forEach((c) => { if (!lastBy[c.item_id]) lastBy[c.item_id] = c; });
  const rows = list.map((i) => {
    const done = lastBy[i.id], v = inv.check[i.id] ?? "";
    const diff = v === "" ? null : Number(v) - Number(i.stock);
    return `<div class="chk-row">
      <span class="inv-name">${esc(itemName(i))}${done ? ` <span class="chk-done ${Number(done.diff)===0?"ok":"bad"}">${Number(done.diff)===0 ? "✓" : `${Number(done.diff)>0?"+":""}${qtyFmt(done.diff)}`}</span>` : ""}</span>
      <span class="muted num">${ko?"예상":"exp."} <b>${qtyFmt(i.stock)}</b>${esc(i.unit||"")}</span>
      <input type="number" inputmode="decimal" min="0" step="any" aria-label="counted" placeholder="${ko?"실제":"count"}" value="${esc(v)}" oninput="setCheck(${i.id}, this.value)">
      <span class="chk-diff num ${diff===null?"":diff===0?"ok":"bad"}" id="cd_${i.id}">${diff===null ? "" : diff===0 ? "✓" : `${diff>0?"+":""}${qtyFmt(diff)}`}</span></div>`;
  }).join("");
  const history = isAdmin() ? (() => {
    const byDate = {}; checks.forEach((c) => (byDate[c.date] ||= []).push(c));
    return Object.keys(byDate).sort().reverse().map((d) => { const bad = byDate[d].filter((c) => Number(c.diff) !== 0);
      return `<div class="prev-row"><span>${d.slice(5)} ${weekday(d)} · ${esc(empName(empById(byDate[d][0].employee_id)))}</span><span>${bad.length ? `<span class="tag-due">${ko?`불일치 ${bad.length}`:`${bad.length} off`}</span> ${bad.map((c) => `${esc(itemName(inv.items.find((i) => i.id === c.item_id)))} ${Number(c.diff)>0?"+":""}${qtyFmt(c.diff)}`).join(", ")}` : `<span class="done-mark">✓ ${ko?"모두 일치":"all match"}</span>`}</span></div>`; }).join("");
  })() : "";
  return `<div class="card chk-card"><h2>📋 ${tl("daily_check")} <span class="muted">${d0.slice(5)}</span></h2>
    ${closedToday ? "" : `<div class="setup-note">${ko?"오늘 마감(판매 수량)을 먼저 저장하면 판매한 만큼 빠진 '예상' 개수와 비교할 수 있어요.":"Save today's closing first so the expected count includes today's sales. / I-save muna ang closing."}</div>`}
    ${rows}
    <button class="btn-primary" id="chkSave" onclick="saveDailyCheck()">${tl("save_check")}</button>
    <p class="hint">${ko?"실제 개수를 입력하면 차이가 바로 보입니다. 저장하면 기록이 남고 재고가 실제 개수로 맞춰집니다.":"Enter the actual count to see the difference. Saving records it and sets stock to the actual count."}</p>
    ${history ? `<div class="section-label">${ko?"최근 7일 재고 확인":"Last 7 days"}</div>${history}` : ""}</div>`;
}
function setCheck(id, v){
  inv.check[id] = v;
  const i = inv.items.find((x) => x.id === id), el = $("cd_" + id); if (!el || !i) return;
  if (v === "") { el.textContent = ""; el.className = "chk-diff num"; return; }
  const diff = Number(v) - Number(i.stock);
  el.textContent = diff === 0 ? "✓" : `${diff>0?"+":""}${qtyFmt(diff)}`; el.className = "chk-diff num " + (diff === 0 ? "ok" : "bad");
}
async function saveDailyCheck(){
  const ko = state.lang === "ko";
  const entries = Object.entries(inv.check).filter(([, v]) => v !== "" && Number(v) >= 0);
  if (!entries.length) { toast(ko ? "실제 개수를 입력하세요" : "Enter counts first"); return; }
  const btn = $("chkSave"); btn.disabled = true;
  const rows = entries.map(([id, v]) => { const i = inv.items.find((x) => String(x.id) === id); return { item_id: Number(id), expected: Number(i.stock), counted: Number(v), employee_id: state.user.id }; });
  const { error } = await sb.from("stock_checks").insert(rows);
  if (error) { toast(tt("save_fail") + error.message); btn.disabled = false; return; }
  const adj = rows.filter((r) => r.counted !== r.expected).map((r) => ({ item_id: r.item_id, type:"ADJUST", qty: r.counted, ref:`check:${today()}`, note: ko ? "퇴근 전 재고 확인" : "End-of-day count", employee_id: state.user.id }));
  if (adj.length) { const a = await sb.from("inventory_moves").insert(adj); if (a.error) toast(tt("save_fail") + a.error.message); }
  const off = rows.filter((r) => r.counted !== r.expected).length;
  inv.check = {};
  toast(off ? (ko ? `저장 · 불일치 ${off}품목 (사장님께 표시됩니다)` : `Saved · ${off} item(s) differ`) : (ko ? "저장 · 모두 일치 ✓" : "Saved · all match ✓"));
  screenInventory();
}

function setMoveType(t){ inv.move.type = t; screenInventory(); }
function pickMoveItem(id){ inv.move.itemId = String(id); screenInventory().then(() => $("mvQty")?.focus()); }
async function saveMove(){
  const qty = Number($("mvQty").value), note = $("mvNote").value.trim();
  if (!(qty > 0) && !(inv.move.type === "ADJUST" && $("mvQty").value !== "" && qty === 0)) { toast(state.lang==="ko" ? "수량을 입력하세요" : "Enter a quantity"); return; }
  const btn = $("mvSave"); btn.disabled = true;
  const { data, error } = await sb.from("inventory_moves").insert({ item_id: Number(inv.move.itemId), type: inv.move.type, qty, note: note || null, employee_id: state.user.id }).select("stock_after").single();
  if (error) { toast(tt("save_fail") + error.message); btn.disabled = false; return; }
  const it = inv.items.find((i) => String(i.id) === inv.move.itemId);
  inv.move.qty = ""; inv.move.note = "";
  toast(`${tt("saved")} · ${itemName(it)} ${qtyFmt(data.stock_after)}${it?.unit||""}`);

async function delMove(id){

function setReq(id, v){ inv.req[id] = Math.max(0, Number(v) || 0); document.querySelectorAll(".rq_" + id).forEach((el) => { if (el !== document.activeElement) el.value = inv.req[id] || ""; }); refreshReqSummary(); }
function stepReq(id, d){ inv.req[id] = Math.max(0, (Number(inv.req[id]) || 0) + d); document.querySelectorAll(".rq_" + id).forEach((el) => { el.value = inv.req[id] || ""; }); refreshReqSummary(); }
function refreshReqSummary(){ const n = Object.values(inv.req).filter((q) => Number(q) > 0).length, b = $("rqSave"); if (b) b.disabled = !n; }
function requestLowItems(){
  inv.items.filter((i) => i.active !== false && isLow(i)).forEach((i) => {
    if (!(Number(inv.req[i.id]) > 0)) inv.req[i.id] = Math.max(1, Number(i.reorder_level) * 2 - Number(i.stock));
  });
  const first = inv.items.find((i) => i.active !== false && isLow(i)); if (first) inv.reqCat = itemCat(first);
  screenInventory().then(() => $("reqCard")?.scrollIntoView({ block:"start" }));
}
async function addCatalogItem(){
  const ko = state.lang === "ko", name = $("niName").value.trim();
  if (!name) { toast(ko ? "품목명을 입력하세요" : "Enter a name"); return; }
  const group = $("niGroup").value.trim() || (ko ? "기타" : "Other");
  const { error } = await sb.from("inventory_items").insert({ name, name_en: $("niNameEn").value.trim() || null, unit: $("niUnit").value.trim() || "개",
    category: inv.reqCat, groups: [`${inv.reqCat}/${group}`], reorder_level: 0, stock: 0, sort: inv.items.length + 1 });
  if (error) { toast(tt("save_fail") + error.message); return; }
  toast(tt("saved")); screenInventory().then(() => $("reqCard")?.scrollIntoView({ block:"start" }));
}
async function submitRequest(){
  const items = Object.entries(inv.req).filter(([, q]) => Number(q) > 0).map(([id, q]) => {
    const i = inv.items.find((x) => String(x.id) === id);
    return { item_id: Number(id), name: i?.name || id, name_en: i?.name_en || null, qty: Number(q), unit: i?.unit || "", category: i ? itemCat(i) : null };
  });
  if (!items.length) return;
  const btn = $("rqSave"); btn.disabled = true;
  const { error } = await sbk.from("supply_requests").insert({ source:"CAFE", requested_by: state.user.name, date: today(), items, status:"PENDING", note: (inv.reqNote||"").trim() || null });

async function cancelRequest(id){

async function decideRequest(id, status){
  const ko = state.lang === "ko";
  const patch = { status, approved_by: state.user.name, decided_at: new Date().toISOString() };
  if (status === "REJECTED") {
    const reason = prompt(ko ? "반려 사유 (선택)" : "Reason (optional)", "");
    if (reason === null) return;
    if (reason.trim()) {
      const { data } = await sbk.from("supply_requests").select("note").eq("id", id).single();
      patch.note = [data?.note, `[${ko?"반려":"Rejected"}] ${reason.trim()}`].filter(Boolean).join("\n");
    }
  }
  const { data, error } = await sbk.from("supply_requests").update(patch).eq("id", id).eq("status", "PENDING").select("id");

  else toast(status === "APPROVED" ? (ko ? "승인 — K-Food 주문함으로 보냈습니다" : "Approved — sent to K-Food") : (ko ? "반려했습니다" : "Rejected"));

}


// 진행 단계 막대 + 배송완료 건 '입고 처리' (K-Food → 카페 재고 IN)
const SUP_FLOW = ["PENDING","APPROVED","CONFIRMED","SHIPPING","DELIVERED"];
function supSteps(r){
  if (r.status === "REJECTED") return "";
  const i = SUP_FLOW.indexOf(r.status);
  return `<div class="sup-steps" aria-label="${esc(supLabel(r.status))}">${SUP_FLOW.map((s, k) => `<span class="${k<=i?"on":""}" title="${esc(supLabel(s))}"></span>`).join("")}</div>`;
}
function receiveHTML(r){
  const ko = state.lang === "ko";
  if (r.status !== "DELIVERED") return "";
  if (r.received_at) return `<div class="done-mark" style="margin-top:6px">✅ ${ko?"입고 완료":"Received"} · ${ago(r.received_at)}</div>`;
  return `<button class="btn-primary" style="margin-top:8px" onclick="receiveRequest(${r.id})">📥 ${tl("receive_stock")}</button>`;
}
async function receiveRequest(id){
  const ko = state.lang === "ko";
  const { data: r, error } = await sbk.from("supply_requests").select("id,items,status,received_at").eq("id", id).single();
  if (error) { toast(error.message); return; }
  if (r.status !== "DELIVERED" || r.received_at) { toast(ko ? "이미 처리된 요청입니다" : "Already received"); return renderScreen(); }
  const items = (r.items||[]).filter((it) => it.item_id && Number(it.qty) > 0);
  if (!confirm(`${ko?"아래 수량을 재고에 입고할까요?":"Add these to stock?"}\n\n${(r.items||[]).map((it) => `· ${reqItemName(it)} +${qtyFmt(it.qty)}${it.unit||""}`).join("\n")}\n\n${ko?"실제 받은 수량이 다르면 입고 후 '실사'로 맞춰 주세요.":"If the delivered amount differs, fix it with a Count afterwards."}`)) return;
  // 1) 재고 입고 기록 → 2) 요청에 입고완료 표시 (2가 실패하면 1을 되돌림)
  let moveIds = [];
  if (items.length) {
    const ins = await sb.from("inventory_moves").insert(items.map((it) => ({ item_id: it.item_id, type:"IN", qty: Number(it.qty),
      note: `${ko?"공급요청":"Supply request"} #${id}`, employee_id: state.user.id }))).select("id");
    if (ins.error) { toast(tt("save_fail") + ins.error.message); return; }
    moveIds = (ins.data||[]).map((m) => m.id);
  }
  const claim = await sbk.from("supply_requests").update({ received_at: new Date().toISOString() }).eq("id", id).eq("status","DELIVERED").is("received_at", null).select("id");
  if (claim.error || !claim.data?.length) {
    if (moveIds.length) await sb.from("inventory_moves").delete().in("id", moveIds);
    toast(claim.error ? tt("save_fail") + claim.error.message : (ko ? "이미 처리된 요청입니다" : "Already received"));
    return renderScreen();
  }
  toast(ko ? "입고 처리했습니다" : "Received into stock"); renderScreen();
}

function monthRange(month){
  const [y, m] = month.split("-").map(Number), nx = m === 12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,"0")}`, pv = m === 1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,"0")}`;
  return { start:`${month}-01`, end:`${nx}-01`, prev:pv, days:new Date(y, m, 0).getDate() };
}
function monthsEnding(month, n){ const out = []; let [y, m] = month.split("-").map(Number); for (let k = 0; k < n; k++) { out.unshift(`${y}-${String(m).padStart(2,"0")}`); if (--m === 0) { m = 12; y--; } } return out; }
const closingTotal = (c) => Number(c.cash||0) + Number(c.gcash||0) + Number(c.card||0);
// items → { menuId: {q, rev, free} }
function closingLines(items){
  const out = {};
  Object.entries(items||{}).forEach(([id, v]) => {
    if (id === "_free") { Object.entries(v||{}).forEach(([fid, q]) => { (out[fid] ||= { q:0, rev:0, free:0 }).free += Number(q)||0; }); return; }
    if (id.startsWith("_")) return;
    const o = (out[id] ||= { q:0, rev:0, free:0 });
    if (v && typeof v === "object") { o.q += Number(v.q)||0; o.rev += (Number(v.q)||0) * (Number(v.p)||0); }
    else { const m = menuById(id); o.q += Number(v)||0; o.rev += (Number(v)||0) * Number(m?.price||0); }
  });
  return out;
}

function updSub(id){ const m = menuById(id), q = cl.qty[id]||0; $("sub_"+id).textContent = q > 0 ? fmt(q*unitPrice(m)) : "—"; recalcClosing(); }
function setQty(id, v){ cl.qty[id] = Math.max(0, Math.floor(Number(v)||0)); updSub(id); }
function stepQty(id, d){ cl.qty[id] = Math.max(0, (cl.qty[id]||0) + d); $("q_"+id).value = cl.qty[id] || ""; updSub(id); }
function setPromo(id, v){ cl.promo[id] = v; updSub(id); }
function stepSrc(k, d){ cl.src[k] = Math.max(0, (cl.src[k]||0) + d); $("src_"+k).value = cl.src[k] || ""; }
function addFree(){ const id = $("freeSel")?.value; if (!id) return; cl.free[id] = (cl.free[id]||0) + Math.max(1, Number($("freeQty").value)||1); screenClosing(); }
function recalcClosing(){
  const menuTotal = state.menus.reduce((s, m) => s + (cl.qty[m.id]||0) * unitPrice(m), 0);
  const recv = (Number(cl.cash)||0) + (Number(cl.gcash)||0) + (Number(cl.card)||0), diff = recv - menuTotal, has = menuTotal > 0;
  if (!$("menuTotal")) return;
  $("menuTotal").textContent = fmt(menuTotal); $("recvTotal").textContent = fmt(recv);
  const f = $("flag");
  if (!has) { f.className = "rec-flag idle"; f.textContent = tt("flag_idle"); }
  else if (Math.abs(diff) < 0.005) { f.className = "rec-flag ok"; f.textContent = tt("flag_ok"); }
  else { f.className = "rec-flag bad"; f.textContent = state.lang==="ko" ? `차액 ${diff>0?"+":""}${fmt(diff)} — 확인 필요` : `Diff ${diff>0?"+":""}${fmt(diff)} — please check / pakisuri`; }
  $("saveBtn").disabled = !(has || recv > 0);
}
async function saveClosing(){
  const items = {};
  state.menus.forEach((m) => { const q = cl.qty[m.id]||0; if (q > 0) items[m.id] = { q, p: unitPrice(m) }; });
  const free = {}; Object.entries(cl.free).forEach(([id, q]) => { if (Number(q) > 0) free[id] = Number(q); });
  if (Object.keys(free).length) items._free = free;
  const menuTotal = Object.values(items).reduce((s, v) => s + (v.q ? v.q*v.p : 0), 0);
  const recv = (Number(cl.cash)||0) + (Number(cl.gcash)||0) + (Number(cl.card)||0);
  if (Math.abs(recv - menuTotal) >= 0.005 && !confirm(state.lang==="ko" ? `메뉴 합계(${fmt(menuTotal)})와 실제 수입(${fmt(recv)})이 다릅니다. 그대로 저장할까요?` : `Menu total (${fmt(menuTotal)}) and income (${fmt(recv)}) differ. Save anyway?`)) return;
  const btn = $("saveBtn"); btn.disabled = true; btn.textContent = tt("saving");
  const src = {}; Object.entries(cl.src).forEach(([k, v]) => { if (Number(v) > 0) src[k] = Number(v); });
  const row = { date: cl.date, items, cash: Number(cl.cash)||0, gcash: Number(cl.gcash)||0, card: Number(cl.card)||0, note: cl.note.trim() || null, closed_by: state.user.id };
  let { error } = await sb.from("closings").upsert({ ...row, sources: src }, { onConflict:"date" });
  if (error && /sources/.test(error.message)) ({ error } = await sb.from("closings").upsert(row, { onConflict:"date" })); // 08 SQL 실행 전
  if (error) { toast(tt("save_fail") + error.message); btn.disabled = false; btn.innerHTML = tl("save_closing"); return; }
  const n = await syncSalesUsage(cl.date, items);
  toast(tt("saved_closing") + (n ? (state.lang==="ko" ? ` · 재고 ${n}품목 차감` : ` · ${n} stock item(s) deducted`) : "")); cl.loadedFor = null; screenClosing();
}

function svgBars(labels, values){
  const W = 720, H = 260, pl = 78, pr = 8, pt = 16, pb = 36, iw = W-pl-pr, ih = H-pt-pb, max = Math.max(...values, 1), n = labels.length, bw = iw/n;
  let g = "";
  for (let i = 0; i <= 3; i++) { const y = pt + ih - ih*i/3; g += `<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#EEE6DA"/><text x="${pl-8}" y="${y+7}" text-anchor="end" font-size="20" fill="#807460">${kfmt(max*i/3)}</text>`; }
  const bars = values.map((v, i) => { const h = ih * v / max, x = pl + i*bw + bw*0.15; return `<rect x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"><title>${labels[i]} · ${fmt(v)}</title></rect>`; }).join("");
  const step = Math.ceil(n / 8);
  const xl = labels.map((l, i) => i % step ? "" : `<text x="${(pl + i*bw + bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="20" fill="#807460">${l}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="daily sales">${g}${bars}${xl}</svg>`;
}
function svgTrend(labels, series){
  const W = 720, H = 340, pl = 86, pr = 24, pt = 20, pb = 42, iw = W-pl-pr, ih = H-pt-pb;
  const all = series.flatMap((s) => s.values), max = Math.max(...all, 1), min = Math.min(0, ...all);
  const x = (i) => pl + (labels.length <= 1 ? iw/2 : iw*i/(labels.length-1)), y = (v) => pt + ih - ((v-min)/((max-min)||1))*ih;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = min + (max-min)*i/4, yy = pt + ih - ih*i/4; g += `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="#EEE6DA"/><text x="${pl-10}" y="${(yy+7).toFixed(1)}" text-anchor="end" font-size="20" fill="#807460">${kfmt(v)}</text>`; }
  const xl = labels.map((l, i) => `<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="20" fill="#807460">${l}</text>`).join("");
  const lines = series.map((s) => `<polyline points="${s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="4" stroke-linejoin="round"/>` +
    s.values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="6" fill="${s.color}"><title>${labels[i]} · ${s.name} ${fmt(v)}</title></circle>`).join("")).join("");
  return `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="trend">${g}${lines}${xl}</svg>`;
}

// ── 출근 사진 자동 정리: 보관기간 지난 사진만 Storage 에서 삭제 (DB 가 기간을 다시 확인) ──
let purgeRunning = false;
async function purgeOldPhotos(manual){
  const ko = state.lang === "ko";
  if (!isAdmin()) return;
  if (purgeRunning) { if (manual) toast(ko ? "사진 정리가 진행 중입니다…" : "Cleanup already running…"); return; }
  if (!manual && state.settings.photo_cleanup_on === today()) return;
  purgeRunning = true;
  const btn = manual ? $("purgeBtn") : null; if (btn) btn.disabled = true;
  try {
    const keep = Math.max(30, Number(state.settings.photo_retention_days) || 90);
    const c = new Date(today() + "T00:00:00"); c.setDate(c.getDate() - keep);
    const cutoff = c.toLocaleDateString("en-CA");
    let total = 0;
    for (let round = 0; round < 20; round++) {
      // photo_purged_at 를 함께 조회: 07_photo_cleanup.sql 미실행이면 여기서 멈춤 (사진 삭제 전)
      const { data, error } = await sb.from("attendance").select("id,photo_path,photo_purged_at").not("photo_path", "is", null).lt("date", cutoff).order("id").limit(100);
      if (error) throw error;
      if (!data?.length) break;
      const rm = await sb.storage.from(STORAGE_BUCKET).remove(data.map((r) => r.photo_path));
      if (rm.error) throw rm.error;
      const up = await sb.from("attendance").update({ photo_path: null }).in("id", data.map((r) => r.id)).select("id,photo_path");
      if (up.error) throw up.error;
      const cleared = (up.data||[]).filter((r) => !r.photo_path).length;
      total += cleared;
      if (data.length < 100 || !cleared) break;
    }
    // 청소 사진도 같은 기간으로 정리 (08 SQL 실행 전이면 건너뜀)
    for (let round = 0; round < 20; round++) {
      const { data, error } = await sb.from("clean_photos").select("id,photo_path").not("photo_path", "is", null).lt("created_at", new Date(cutoff + "T00:00:00+08:00").toISOString()).order("id").limit(100);
      if (error || !data?.length) break;
      const rm = await sb.storage.from(STORAGE_BUCKET).remove(data.map((r) => r.photo_path));
      if (rm.error) throw rm.error;
      const up = await sb.from("clean_photos").update({ photo_path: null }).in("id", data.map((r) => r.id)).select("id,photo_path");
      if (up.error) throw up.error;
      const cleared = (up.data||[]).filter((r) => !r.photo_path).length;
      total += cleared;
      if (data.length < 100 || !cleared) break;
    }
    await setSetting("photo_cleanup_on", today());
    if (manual) { toast(ko ? `사진 ${total}장 정리했습니다` : `Removed ${total} photo(s)`); renderScreen(); }
  } catch (e) {
    if (manual) toast((ko ? "정리 실패: " : "Cleanup failed: ") + (e.message || e));
  } finally { purgeRunning = false; if (btn) btn.disabled = false; }
}

// ── 급여: 출퇴근 기록 → 근무시간표 → 지각/조퇴 차감 자동 계산 (15일·말일 2회 지급) ──
const PH_MS = 8 * 3600e3;
const toHM = (t) => String(t || "").slice(0, 5);
const hmToMin = (t) => { const [h, m] = toHM(t).split(":").map(Number); return (h||0) * 60 + (m||0); };
const dayStart = (d) => Date.parse(`${d}T00:00:00+08:00`);
const minOfDay = (ts, d) => Math.round((new Date(ts).getTime() - dayStart(d)) / 60000);
const fmtH = (min) => { const h = Math.floor(min / 60), m = Math.round(min % 60); return m ? `${h}h ${m}m` : `${h}h`; };
const round2 = (n) => Math.round(n * 100) / 100;
const fmt2 = (n) => PESO + (Number(n) || 0).toLocaleString("en-PH", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const empPay = (e) => ({ rate: Number(e?.daily_rate ?? 508), std: Number(e?.std_hours ?? 8), start: hmToMin(e?.shift_start || "09:00"), end: hmToMin(e?.shift_end || "18:00"), brk: Number(e?.break_min ?? 60) });
function payPeriod(month, half){ const { days } = monthRange(month); return half === 1 ? { start:`${month}-01`, end:`${month}-15` } : { start:`${month}-16`, end:`${month}-${String(days).padStart(2,"0")}` }; }
function currentPeriod(){ const d = today(); return { month: d.slice(0, 7), half: Number(d.slice(8)) <= 15 ? 1 : 2 }; }
// 한 사람의 하루 출퇴근 기록들 → 정규시간·지각·조퇴·연장
function shiftCalc(e, date, recs){
  const p = empPay(e); let reg = 0, ot = 0, late = 0, early = 0, open = false;
  recs.forEach((r, k) => {
    if (!r.clock_out) { open = true; return; }
    const inM = minOfDay(r.clock_in, date), outM = minOfDay(r.clock_out, date);
    const span = Math.max(0, Math.min(outM, p.end) - Math.max(inM, p.start));
    reg += Math.max(0, span - (span > 300 ? p.brk : 0));
    if (k === 0) late = Math.max(0, inM - p.start);
    if (k === recs.length - 1) { early = Math.max(0, p.end - outM); const o = outM - p.end; if (o >= 30) ot += Math.floor(o / 30) * 30; }
  });
  reg = Math.min(reg, p.std * 60);
  return { reg, ot, late, early, open };
}
async function computePayroll(period, empIds){
  const [att, adj] = await Promise.all([
    sb.from("attendance").select("id,employee_id,date,clock_in,clock_out,manual_edit,verified").gte("date", period.start).lte("date", period.end).order("clock_in"),
    sb.from("pay_adjustments").select("id,employee_id,date,kind,amount,note").gte("date", period.start).lte("date", period.end).order("date"),
  ]);
  if (att.error) throw att.error;
  const otOn = state.settings.ot_enabled !== "0", mult = Number(state.settings.ot_multiplier || 1);
  return empIds.map((id) => {
    const e = empById(id), p = empPay(e), hourly = p.rate / p.std, mine = (att.data||[]).filter((r) => r.employee_id === id), byDate = {};
    mine.forEach((r) => (byDate[r.date] ||= []).push(r));
    const days = Object.keys(byDate).sort().map((d) => { const c = shiftCalc(e, d, byDate[d]);
      return { date:d, recs:byDate[d], ...c, pay: round2(c.reg / 60 * hourly), otPay: otOn ? round2(c.ot / 60 * hourly * mult) : 0 }; });
    const adjs = (adj.data||[]).filter((a) => a.employee_id === id);
    const s = (f) => days.reduce((t, d) => t + d[f], 0);
    const other = adjs.filter((a) => a.kind !== "MINUS").reduce((t, a) => t + Number(a.amount), 0), ded = adjs.filter((a) => a.kind === "MINUS").reduce((t, a) => t + Number(a.amount), 0);
    const basic = round2(s("pay")), otPay = round2(s("otPay"));
    return { id, e, p, hourly, days, adjs, worked: days.filter((d) => d.reg > 0).length, reg: s("reg"), ot: s("ot"), late: s("late"), early: s("early"), open: days.filter((d) => d.open).length,
      basic, otPay, other: round2(other), ded: round2(ded), net: round2(basic + otPay + other - ded) };
  });
}

      <div class="pl-row"><span>${ko?"기본급":"Basic pay"} (${fmtH(r.reg)})</span><b>${fmt2(r.basic)}</b></div>
      <div class="pl-row"><span>${ko?"OT 수당":"Overtime pay"} (${fmtH(r.ot)})</span><b>${fmt2(r.otPay)}</b></div>
      <div class="pl-row"><span>${ko?"기타 지급":"Other pay"}</span><b>${fmt2(r.other)}</b></div>
      <div class="pl-row"><span>${ko?"공제":"Deductions"}</span><b>−${fmt2(r.ded)}</b></div>
      <div class="pl-row total"><span>${ko?"실지급액":"Net pay"}</span><b>${fmt2(r.net)}</b></div></div>
    ${r.open ? `<div class="setup-note">⚠️ ${ko?`퇴근 기록이 없는 날이 ${r.open}일 있어요. 근태 탭에서 퇴근 시각을 입력하면 계산에 포함됩니다.`:`${r.open} day(s) have no clock-out. Fix them in Attendance to include them.`}</div>` : ""}
    ${paid ? `<div class="done-mark" style="margin-top:10px">✓ ${ko?"지급 완료":"Paid"} · ${fmt2(paid.net)} · ${ago(paid.paid_at)} ${ko?"(지출 '직원월급'에 기록됨)":"(recorded as a wage expense)"}</div>
        <button class="btn-ghost" onclick="undoPay(${paid.id}, ${paid.expense_id || "null"})">${ko?"지급 취소":"Undo payment"}</button>`
      : `<button class="btn-primary" onclick="markPaid(${r.id})" ${ended ? "" : `title="${ko?"기간이 끝나기 전":"period not ended"}"`}>💸 ${ko?"지급 완료 처리":"Mark as paid"} · ${fmt2(r.net)}</button>
        <p class="hint">${ko?"지급 완료 처리하면 지출(직원월급)에 자동으로 기록되고 이 기간 금액이 고정됩니다.":"Marking as paid records a wage expense and locks this period."}</p>`}
  </div>`;
}
async function addAdj(empId){
  const amount = Number($("adjAmt").value);
  if (!(amount > 0)) { toast(state.lang==="ko" ? "금액을 입력하세요" : "Enter an amount"); return; }
  const { error } = await sb.from("pay_adjustments").insert({ employee_id: empId, date: $("adjDate").value, kind: $("adjKind").value, amount, note: $("adjNote").value.trim() || null, created_by: state.user.id });
  if (error) { toast(tt("save_fail") + error.message); return; }
  toast(tt("saved")); screenPayroll();
}
async function delAdj(id){
  if (!confirm(state.lang==="ko" ? "삭제할까요?" : "Delete?")) return;
  const { error } = await sb.from("pay_adjustments").delete().eq("id", id);
  if (error) { toast(error.message); return; }
  screenPayroll();
}
async function markPaid(empId){
  const ko = state.lang === "ko", period = payPeriod(pay.month, pay.half);
  const [r] = await computePayroll(period, [empId]);
  if (r.open && !confirm(ko ? "퇴근 기록이 없는 날은 계산에서 빠졌습니다. 그래도 지급 처리할까요?" : "Days without clock-out are excluded. Continue?")) return;
  if (!confirm(`${empName(r.e)} · ${period.start} ~ ${period.end}\n${ko?"실지급":"Net"} ${fmt2(r.net)}\n\n${ko?"지급 완료로 처리할까요?":"Mark as paid?"}`)) return;
  const exp = await sb.from("expenses").insert({ date: today() < period.end ? today() : period.end, category:"LABOR", amount: r.net, note: `${ko?"급여":"Wages"} ${r.e.name} ${period.start.slice(5)}~${period.end.slice(5)}`, created_by: state.user.id }).select("id").single();
  if (exp.error) { toast(tt("save_fail") + exp.error.message); return; }
  const run = await sb.from("payroll_runs").insert({ employee_id: empId, period_start: period.start, period_end: period.end, days: r.worked, regular_hours: round2(r.reg/60), ot_hours: round2(r.ot/60), late_min: r.late,
    basic: r.basic, ot_pay: r.otPay, other_pay: r.other, deductions: r.ded, net: r.net, details: r.days.map((d) => ({ date:d.date, reg:d.reg, ot:d.ot, late:d.late, early:d.early, pay:d.pay, ot_pay:d.otPay })), expense_id: exp.data.id, paid_by: state.user.id });
  if (run.error) { await sb.from("expenses").delete().eq("id", exp.data.id); toast(tt("save_fail") + run.error.message); return; }
  toast(ko ? "지급 완료 처리했습니다" : "Marked as paid"); screenPayroll();
}
async function undoPay(runId, expenseId){
  if (!confirm(state.lang==="ko" ? "지급 기록과 지출 기록을 취소할까요?" : "Undo this payment and its expense?")) return;
  const { error } = await sb.from("payroll_runs").delete().eq("id", runId);
  if (error) { toast(error.message); return; }
  if (expenseId) await sb.from("expenses").delete().eq("id", expenseId);
  screenPayroll();
}

// ── 퇴근 전 청소 사진 (매장·야외·주방·화장실) ──
const CLEAN_AREAS = { STORE:{ko:"매장",en:"Store",tl:"Tindahan"}, OUTSIDE:{ko:"야외",en:"Outside",tl:"Labas"}, KITCHEN:{ko:"주방",en:"Kitchen",tl:"Kusina"}, RESTROOM:{ko:"화장실",en:"Restroom",tl:"Banyo"} };
const areaLabel = (a) => { const e = CLEAN_AREAS[a]; return !e ? a : (state.lang==="ko" ? e.ko : e.en); };
const cleanShots = {}; // area → 방금 찍은 사진 미리보기 URL
function cameraModal(title, facing){
  return new Promise(async (resolve) => {
    const ko = state.lang === "ko", m = document.createElement("div");
    m.className = "modal cam-modal"; m.setAttribute("role", "dialog");
    m.innerHTML = `<div class="cam-sheet"><div class="cam-title">${esc(title)}</div><div class="cam-wrap"><video playsinline muted autoplay></video></div>
      <button class="btn-primary" data-act="shot">📸 ${tl("take_photo")}</button><button class="btn-ghost" data-act="cancel">${tt("cancel")}</button></div>`;
    document.body.appendChild(m);
    let stream = null;
    const done = (b) => { if (stream) stream.getTracks().forEach((t) => t.stop()); m.remove(); resolve(b); };
    try { stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: facing, width:{ ideal:1280 }, height:{ ideal:960 } }, audio:false }); }
    catch (e) { toast(tt("cam_denied")); return done(null); }
    const v = m.querySelector("video"); v.srcObject = stream; v.style.transform = facing === "user" ? "scaleX(-1)" : "none"; v.play().catch(() => {});
    m.querySelector('[data-act="cancel"]').onclick = () => done(null);
    m.querySelector('[data-act="shot"]').onclick = () => {
      if (!v.videoWidth) return;
      const s = Math.min(1, 800 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement("canvas");
      c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      c.toBlob((b) => done(b), "image/jpeg", 0.6);
    };
  });
}
async function cleanPhotosFor(attId){
  const { data, error } = await sb.from("clean_photos").select("id,area,photo_path,created_at,photo_purged_at").eq("attendance_id", attId).order("id");
  if (error) return null; // 08 SQL 실행 전
  const latest = {}; (data||[]).forEach((p) => { latest[p.area] = p; });
  return latest;
}
function cleanCardHTML(open, latest){
  if (!latest) return "";
  const ko = state.lang === "ko", n = Object.keys(CLEAN_AREAS).filter((a) => latest[a]).length;
  return `<div class="section-label">🧹 ${tl("clean_photos")} (${n}/4)</div>
    <div class="clean-grid">${Object.keys(CLEAN_AREAS).map((a) => `<button class="clean-tile ${latest[a]?"done":""}" onclick="takeCleanPhoto(${open.id},'${a}')">
      ${cleanShots[a] ? `<img src="${cleanShots[a]}" alt="">` : `<span class="clean-ico">${latest[a] ? "✓" : "📷"}</span>`}
      <b>${areaLabel(a)}${ko?"":`<span class="lang-sub">${CLEAN_AREAS[a].tl}</span>`}</b>${latest[a] ? `<small>${timeHM(latest[a].created_at)}</small>` : ""}</button>`).join("")}</div>
    <p class="hint">${ko?"청소를 마치고 각 구역을 찍어 주세요. 사진 시각은 서버가 기록합니다.":"After cleaning, take a photo of each area. Time is recorded by the server. / Kunan ng litrato ang bawat lugar."}</p>`;
}
async function takeCleanPhoto(attId, area){
  const blob = await cameraModal(`🧹 ${areaLabel(area)}`, "environment"); if (!blob) return;
  const path = `clean/${today()}/${state.user.id}_${attId}_${area}_${Date.now()}.jpg`;
  const up = await sb.storage.from(STORAGE_BUCKET).upload(path, blob, { contentType:"image/jpeg", upsert:false });
  if (up.error) { toast(tt("save_fail") + up.error.message); return; }
  const { error } = await sb.from("clean_photos").insert({ attendance_id: attId, employee_id: state.user.id, area, photo_path: path });
  if (error) { toast(tt("save_fail") + error.message); return; }
  if (cleanShots[area]) URL.revokeObjectURL(cleanShots[area]);
  cleanShots[area] = URL.createObjectURL(blob);
  toast(`${areaLabel(area)} ✓`); screenClock();
}
async function showCleanPhotos(attId){
  const latest = await cleanPhotosFor(attId); if (!latest) return;
  const list = Object.keys(CLEAN_AREAS).map((a) => latest[a]).filter((p) => p && p.photo_path);
  const signed = list.length ? (await sb.storage.from(STORAGE_BUCKET).createSignedUrls(list.map((p) => p.photo_path), 300)).data || [] : [];
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog");
  m.innerHTML = `<div class="clean-gallery">${Object.keys(CLEAN_AREAS).map((a) => { const p = latest[a], k = list.indexOf(p), u = k >= 0 ? signed[k]?.signedUrl : null;
    return `<figure>${u ? `<img src="${u}" alt="">` : `<div class="clean-missing">${p?.photo_purged_at ? "📷✕" : "—"}</div>`}<figcaption>${areaLabel(a)}${p ? ` · ${timeHM(p.created_at)}` : ""}</figcaption></figure>`; }).join("")}</div>`;
  m.onclick = () => m.remove(); document.body.appendChild(m);
}

// ── 근태 수정 (사장): 출퇴근 시각 수정 · 빠진 근무 추가 ──
async function editShift(id){
  const r = attState.rows.find((x) => x.id === id); if (!r) return;
  const ko = state.lang === "ko";
  const cur = `${timeHM(r.clock_in)}-${r.clock_out ? timeHM(r.clock_out) : ""}`;
  const v = prompt(ko ? `${r.date} 출근-퇴근 시각 (필리핀 시간, 예: 09:00-18:00)` : `${r.date} in-out time (PH time, e.g. 09:00-18:00)`, cur);
  if (v === null) return;
  const mm = v.trim().match(/^([01]?\d|2[0-3]):([0-5]\d)\s*-\s*(?:([01]?\d|2[0-3]):([0-5]\d))?$/);
  if (!mm) { toast(ko ? "09:00-18:00 형식으로 입력하세요" : "Use 09:00-18:00"); return; }
  const inTs = new Date(`${r.date}T${mm[1].padStart(2,"0")}:${mm[2]}:00+08:00`);
  let outTs = mm[3] ? new Date(`${r.date}T${mm[3].padStart(2,"0")}:${mm[4]}:00+08:00`) : null;
  if (outTs && outTs < inTs) outTs = new Date(outTs.getTime() + 864e5);
  const { error } = await sb.from("attendance").update({ clock_in: inTs.toISOString(), clock_out: outTs ? outTs.toISOString() : null, admin_edit: true }).eq("id", id);
  if (error) { toast(tt("save_fail") + error.message); return; }
  toast(tt("saved")); screenAttendance();
}
async function addShift(){
  const ko = state.lang === "ko", emp = Number($("asEmp").value), d = $("asDate").value, a = $("asIn").value, b = $("asOut").value;
  if (!emp || !d || !a) { toast(ko ? "직원·날짜·출근 시각을 입력하세요" : "Choose staff, date and time in"); return; }
  const inTs = new Date(`${d}T${a}:00+08:00`); let outTs = b ? new Date(`${d}T${b}:00+08:00`) : null;
  if (outTs && outTs < inTs) outTs = new Date(outTs.getTime() + 864e5);
  const { error } = await sb.from("attendance").insert({ employee_id: emp, date: d, clock_in: inTs.toISOString(), clock_out: outTs ? outTs.toISOString() : null, admin_edit: true });
  if (error) { toast(tt("save_fail") + error.message); return; }
  toast(tt("saved")); screenAttendance();
}
