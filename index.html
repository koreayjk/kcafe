<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F6F2EC">
<title>Bahay Cafe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* ── 브랜드 팔레트: 로고 받으면 여기 5개 값만 교체 (K-Food 크림 베이스 유지) ── */
:root {
  --accent:#8B4A25;      /* 메인 액센트 (흰 배경 대비 6.5:1) */
  --accent-dark:#6B3519; /* 그라데이션 끝 */
  --accent-2:#A65D33;    /* 막대 그래프 시작색 */
  --accent-soft:#EBD3C2; /* 액센트 배경 위 보조 글자 */
  --accent-bg:#F8EEE7;   /* 선택된 행/카드 배경 */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Pretendard", "Segoe UI", sans-serif; background:#F6F2EC; color:#1E1A17; -webkit-text-size-adjust:100%; }
input, select, button { font-family: inherit; }
/* muted text darkened for AA contrast (was #807460) */
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
input:focus, select:focus, textarea:focus { border-color:var(--accent); }
.peso-field:focus-within { border-color:var(--accent); }
/* 정렬용 숫자 모노 (시스템 폰트, 외부 로딩 없음; 한글은 Pretendard로 폴백) */
/* GCash = 중립 정보(파랑) KPI 변형 */
.kpi.accent-blue { background:linear-gradient(135deg,#2563EB,#1E40AF); border:none; }
.kpi.accent-blue .kpi-label,.kpi.accent-blue .delta,.kpi.accent-blue .delta.up,.kpi.accent-blue .delta.down,.kpi.accent-blue .delta.flat { color:#C7D9F3; }
.kpi.accent-blue .kpi-value { color:#fff; }
.login-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
.login-card { background:#fff; border-radius:20px; padding:34px 30px; width:100%; max-width:390px; box-shadow:0 14px 40px rgba(110,60,30,.12); }
.login-logo-img { width:100%; max-width:260px; display:block; margin:6px auto 18px; }
.login-card h1 { text-align:center; font-size:18px; margin-bottom:4px; letter-spacing:-.3px; }
.login-card .sub { text-align:center; color:#807460; font-size:12px; margin-bottom:22px; letter-spacing:.5px; text-transform:uppercase; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
.field select, .field input { width:100%; border:1.5px solid #D8CDBD; border-radius:11px; padding:12px; font-size:15px; background:#fff; }
.err { background:#FBE4E3; color:var(--accent); padding:10px; border-radius:9px; font-size:13px; margin-bottom:14px; text-align:center; }
.setup-note { background:#FBF1DC; color:#9A6A1E; padding:14px; border-radius:11px; font-size:12.5px; line-height:1.6; margin-bottom:16px; }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:13px 20px; background:#fff; border-bottom:1px solid #E6DFD4; gap:12px; }
.topbar-logo { height:30px; }
.who { display:flex; align-items:center; gap:10px; }
.who-name { font-size:13px; font-weight:600; text-align:right; }
.who-name small { display:block; color:#807460; font-weight:500; }
.logout { border:1px solid #D8CDBD; background:#fff; border-radius:9px; padding:7px 12px; font-size:12px; cursor:pointer; color:#5E4A36; }
.tabs { display:flex; gap:2px; padding:10px 20px 0; background:#fff; border-bottom:1px solid #E6DFD4; overflow-x:auto; }
.tab { border:none; background:none; padding:10px 14px; font-size:14px; font-weight:600; color:#807460; cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap; }
.tab.on { color:var(--accent); border-bottom-color:var(--accent); }
.content { padding:20px; max-width:1080px; margin:0 auto; }
.grid-2 { display:grid; grid-template-columns:1.4fr 1fr; gap:18px; }
@media(max-width:820px){ .grid-2{ grid-template-columns:1fr; } }
.card { background:#fff; border:1px solid #E6DFD4; border-radius:16px; padding:20px; margin-bottom:18px; }
.card-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.card h2 { font-size:16px; font-weight:800; margin:0 0 14px; letter-spacing:-.3px; }
.card-head h2 { margin:0; }
.date-pill { background:#F3ECE0; color:#8E7A5E; font-size:12px; font-weight:600; padding:5px 10px; border-radius:20px; border:none; }
.muted { color:#807460; font-size:12px; }
.section-label { font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; margin:18px 0 8px; }
.menu-row { display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #F0E9DD; }
.m-name { font-weight:600; font-size:14px; }
.m-price { color:#807460; font-size:13px; }
.m-sub { font-weight:700; font-variant-numeric:tabular-nums; min-width:62px; text-align:right; color:#5E4A36; }
.stepper { display:flex; align-items:center; gap:4px; }
.stepper button { width:38px; height:38px; border:1px solid #D8CDBD; background:#fff; border-radius:8px; font-size:18px; cursor:pointer; color:#5E4A36; }
.stepper input { width:52px; text-align:center; border:1px solid #D8CDBD; border-radius:8px; padding:8px; font-size:15px; font-variant-numeric:tabular-nums; }
.exp-row { display:grid; grid-template-columns:1.2fr 100px auto; gap:8px; margin-bottom:8px; }
.exp-row select, .exp-row input { border:1px solid #D8CDBD; border-radius:8px; padding:9px 10px; font-size:13px; width:100%; }
.exp-add { border:1px solid #D8CDBD; background:#F6F2EC; border-radius:8px; width:38px; cursor:pointer; font-size:17px; color:#5E4A36; }
.sticky { align-self:start; }
.pay-input { margin-bottom:12px; }
.pay-input label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
.peso-field { display:flex; align-items:center; border:1.5px solid #D8CDBD; border-radius:10px; overflow:hidden; }
.peso-field span { padding:0 12px; color:#807460; font-weight:700; background:#F6F2EC; align-self:stretch; display:flex; align-items:center; }
.peso-field input { flex:1; border:none; padding:12px; font-size:16px; font-variant-numeric:tabular-nums; outline:none; width:100%; }
.reconcile { background:#FAF6EF; border-radius:12px; padding:14px; margin:14px 0; }
.rec-row { display:flex; justify-content:space-between; padding:5px 0; font-size:14px; }
.rec-row.big { font-size:16px; padding:12px 0; border-top:1px solid #E6DFD4; margin-top:8px; }
.rec-row b { font-variant-numeric:tabular-nums; }
.rec-flag { margin-top:8px; padding:10px 12px; border-radius:9px; font-weight:700; font-size:14px; text-align:center; }
.rec-flag.ok { background:#E3F3E8; color:#1F7A43; }
.rec-flag.bad { background:#FBE4E3; color:var(--accent); }
.rec-flag.idle { background:#F0E9DD; color:#807460; font-weight:500; }
.btn-primary { width:100%; background:var(--accent); color:#fff; border:none; padding:14px; border-radius:11px; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px; }
.btn-primary:disabled { background:#D8CDBD; cursor:not-allowed; }
.hint { font-size:12px; color:#807460; margin:10px 0 0; line-height:1.5; }
.prev-row { display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px solid #F0E9DD; }
.kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
@media(max-width:820px){ .kpi-row{ grid-template-columns:1fr; } }
.kpi { background:#fff; border:1px solid #E6DFD4; border-radius:14px; padding:18px; }
.kpi.accent { background:linear-gradient(135deg,var(--accent),var(--accent-dark)); border:none; }
.kpi-label { font-size:12px; color:#807460; margin-bottom:8px; }
.kpi.accent .kpi-label { color:var(--accent-soft); }
.kpi-value { font-size:23px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
.kpi.accent .kpi-value { color:#fff; }
.bar-row { display:grid; grid-template-columns:92px 1fr auto; align-items:center; gap:10px; margin-bottom:11px; }
.bar-name { font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; }
.bar-track { background:#F0E9DD; border-radius:6px; height:13px; overflow:hidden; }
.bar-fill { background:linear-gradient(90deg,var(--accent-2),var(--accent)); height:100%; }
.bar-val { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:66px; text-align:right; }
.badge { font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; }
.data-table { width:100%; border-collapse:collapse; font-size:13px; }
.data-table th { text-align:left; color:#807460; font-size:11px; text-transform:uppercase; letter-spacing:.4px; padding:8px 6px; border-bottom:2px solid #E6DFD4; }
.data-table th small { display:block; font-weight:500; text-transform:none; letter-spacing:0; color:#BDB2A0; }
.data-table td { padding:9px 6px; border-bottom:1px solid #F0E9DD; }
.tscroll { overflow:auto; max-height:76vh; -webkit-overflow-scrolling:touch; }
.tscroll thead th { position:sticky; top:0; background:#fff; z-index:2; }
.data-table .num { text-align:right; font-variant-numeric:tabular-nums; }
.data-table .pos { color:#1F7A43; }
.data-table .neg { color:var(--accent); }
.empty { color:#807460; text-align:center; padding:18px; }
.tag-due { background:#FBE4E3; color:var(--accent); padding:2px 8px; border-radius:6px; font-weight:700; }
.formula { margin-top:14px; background:#FAF6EF; border-radius:10px; padding:12px 14px; font-size:13px; color:#5E4A36; line-height:1.6; }
.order-card { border:1px solid #E6DFD4; border-radius:12px; padding:14px; margin-bottom:12px; }
.order-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.order-items { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.chip { background:#F3ECE0; color:#5E4A36; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; }
.order-foot { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#5E4A36; gap:8px; flex-wrap:wrap; }
.status { font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }
.s-CONFIRMED { background:#E8EEF6; color:#3A5A82; }
.s-SHIPPING { background:#FBF1DC; color:#9A6A1E; }
.s-DELIVERED { background:#E3F3E8; color:#1F7A43; }
.btn-mini { border:1px solid var(--accent); color:var(--accent); background:#fff; border-radius:8px; padding:9px 12px; font-size:12px; font-weight:700; cursor:pointer; }
.done-mark { color:#1F7A43; font-weight:700; font-size:13px; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1E1A17; color:#fff; padding:13px 22px; border-radius:30px; font-size:14px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:99; }
.loading { text-align:center; padding:40px; color:#807460; }
.report-pl .pl-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #F0E9DD; font-size:14px; }
.report-pl .pl-row.total { border-top:2px solid #E6DFD4; border-bottom:none; font-weight:800; font-size:17px; padding-top:13px; margin-top:4px; }
.report-pl b { font-variant-numeric:tabular-nums; }
.filter-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.filter-bar select, .filter-bar input { border:1px solid #D8CDBD; border-radius:9px; padding:8px 10px; font-size:13px; }
.scroll-list { max-height:none; }
.kpi-row.four { grid-template-columns:repeat(4,1fr); }
@media(max-width:820px){ .kpi-row.four{ grid-template-columns:repeat(2,1fr); } }
.kpi .delta { font-size:12px; font-weight:700; margin-top:5px; }
.kpi.accent .delta { color:var(--accent-soft); }
.delta.up{ color:#1F7A43; } .delta.down{ color:var(--accent); } .delta.flat{ color:#807460; }
.kpi.accent .delta.up,.kpi.accent .delta.down,.kpi.accent .delta.flat{ color:var(--accent-soft); }
.report-title { font-size:18px; font-weight:800; margin:2px 0 16px; letter-spacing:-.3px; }
.report-title span { color:#807460; font-weight:600; font-size:14px; }
.ebar-row { display:grid; grid-template-columns:110px 1fr auto; align-items:center; gap:10px; margin-bottom:10px; }
.ebar-name { font-size:13px; font-weight:600; }
.ebar-track { background:#F0E9DD; border-radius:6px; height:12px; overflow:hidden; }
.ebar-fill { background:linear-gradient(90deg,#E0A93F,#C9842A); height:100%; }
.ebar-val { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:66px; text-align:right; }
.pl-sub { padding-left:14px; color:#807460; font-size:13px; }
.legend { display:flex; gap:18px; margin-bottom:6px; }
.legend span { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#5E4A36; }
.legend i { width:11px; height:11px; border-radius:3px; display:inline-block; }
.minibar { display:inline-block; height:8px; border-radius:4px; background:linear-gradient(90deg,var(--accent-2),var(--accent)); vertical-align:middle; margin-right:6px; }
.m-en { display:block; font-size:11px; color:#807460; font-weight:500; font-style:normal; }
.add-form { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
.add-form input, .add-form select { border:1px solid #D8CDBD; border-radius:8px; padding:9px 10px; font-size:13px; }
.add-form input { flex:1; min-width:80px; }
.mng-row { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #F0E9DD; font-size:14px; }
.mng-price { font-weight:700; font-variant-numeric:tabular-nums; color:#5E4A36; }
.mng-del { border:1px solid #E0C0BE; color:var(--accent); background:#fff; border-radius:7px; padding:5px 10px; font-size:12px; font-weight:600; cursor:pointer; }
.lang-toggle { display:flex; gap:4px; }
.lang-toggle button { border:1px solid #D8CDBD; background:#fff; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; color:#807460; cursor:pointer; white-space:nowrap; }
.lang-toggle button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.lang-sub { display:block; font-size:11px; color:#807460; font-weight:500; font-style:italic; margin-top:1px; }
.btn-primary .lang-sub { color:var(--accent-soft); font-weight:600; }
.update-stamp { font-size:12.5px; color:#807460; font-weight:600; margin:0 0 16px; }
.update-stamp b { color:#5E4A36; }
.mng-row.editable { grid-template-columns:1fr 96px auto; }
.mng-price-input { width:96px; text-align:right; border:1px solid #D8CDBD; border-radius:7px; padding:6px 8px; font-size:13px; font-variant-numeric:tabular-nums; }
.legend.multi { flex-wrap:wrap; gap:8px 16px; }
/* ── Bahay Cafe 추가 ── */
.wordmark { text-align:center; margin:6px 0 18px; }
.wordmark b { display:block; font-size:28px; font-weight:800; letter-spacing:-.6px; color:var(--accent); }
.wordmark small { display:block; font-size:11px; color:#807460; letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
.topbar-mark { font-size:17px; font-weight:800; color:var(--accent); letter-spacing:-.4px; white-space:nowrap; }
.tab { min-height:44px; }
.logout, .lang-toggle button, .btn-mini, .mng-del { min-height:36px; }
.kpi.alert { border-color:#E0A9A6; background:#FDF3F2; }
.kpi.alert .kpi-value { color:#B5322E; }
.kpi .kpi-sub { font-size:12px; color:#5E4A36; margin-top:6px; line-height:1.5; }
.dot-red { display:inline-block; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:#B5322E; color:#fff; font-size:11px; font-weight:700; line-height:18px; text-align:center; margin-left:5px; vertical-align:1px; }
.feed-row { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #F0E9DD; font-size:14px; }
.feed-row:last-child { border-bottom:none; }
.feed-row .muted { white-space:nowrap; }
.soon { border:1.5px dashed #D8CDBD; border-radius:14px; padding:22px; text-align:center; color:#5E4A36; line-height:1.7; }
.soon b { color:var(--accent); }
.emp-row { display:grid; grid-template-columns:1fr 96px 84px auto; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid #F0E9DD; font-size:13px; }
.emp-row select, .emp-row input { border:1px solid #D8CDBD; border-radius:7px; padding:7px 8px; font-size:13px; width:100%; }
.emp-row.off { opacity:.55; }
@media(max-width:560px){ .emp-row{ grid-template-columns:1fr 1fr; } }
.badge.admin { background:var(--accent-bg); color:var(--accent); }
.badge.staff { background:#E8EEF6; color:#3A5A82; }
.s-PENDING { background:#F0E9DD; color:#8E7A5E; }
.s-APPROVED { background:var(--accent-bg); color:var(--accent); }
.s-REJECTED { background:#FBE4E3; color:#B5322E; }
@media(max-width:560px){ .topbar{ flex-wrap:wrap; padding:10px 16px; } .who{ width:100%; justify-content:space-between; } .content{ padding:16px; } }
.cam-wrap { background:#1E1A17; border-radius:14px; overflow:hidden; margin-bottom:12px; aspect-ratio:4/3; }
.cam-wrap video, .cam-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
.cam-wrap video { transform:scaleX(-1); }
.btn-ghost { width:100%; background:#fff; color:#5E4A36; border:1.5px solid #D8CDBD; padding:13px; border-radius:11px; font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }
.clock-state { font-size:22px; font-weight:800; letter-spacing:-.4px; margin-bottom:4px; }
.clock-state.on { color:#1F7A43; }
.clock-sub { color:#5E4A36; font-size:14px; margin-bottom:14px; line-height:1.6; }
.gps-line { padding:10px 12px; border-radius:10px; font-size:14px; font-weight:600; margin-bottom:6px; background:#F0E9DD; color:#5E4A36; }
.gps-line.ok { background:#E3F3E8; color:#1F7A43; }
.gps-line.warn { background:#FBF1DC; color:#9A6A1E; }
.att-table td { vertical-align:top; min-width:118px; }
.att-table td:first-child, .att-table th:first-child { min-width:64px; position:sticky; left:0; background:#fff; z-index:1; }
.att-table thead th:first-child { z-index:3; }
.shift { font-size:12px; line-height:1.5; padding:4px 6px; border-radius:7px; margin-bottom:4px; background:#E3F3E8; }
.shift.warn { background:#FBF1DC; }
.shift.open { outline:1.5px dashed #9A6A1E; }
.shift b { font-size:13px; }
.photo-btn { border:1px solid #D8CDBD; background:#fff; border-radius:6px; padding:2px 6px; font-size:12px; cursor:pointer; min-height:26px; }
.att-total td { font-weight:700; border-top:2px solid #E6DFD4; background:#FAF6EF; }
.modal { position:fixed; inset:0; background:rgba(20,15,10,.82); display:grid; place-items:center; z-index:100; padding:16px; }
.modal img { max-width:100%; max-height:80vh; border-radius:12px; display:block; }
.modal .modal-cap { color:#fff; text-align:center; margin-top:10px; font-size:14px; }
.fchips { display:flex; gap:6px; overflow-x:auto; margin:12px 0; padding-bottom:2px; }
.fchip { border:1px solid #D8CDBD; background:#fff; border-radius:20px; padding:8px 14px; font-size:13px; font-weight:600; color:#5E4A36; cursor:pointer; white-space:nowrap; min-height:38px; }
.fchip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.note-item { display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid #F0E9DD; padding:12px 2px; cursor:pointer; font:inherit; color:inherit; }
.note-item:last-child { border-bottom:none; }
.note-item.done .note-title { color:#807460; }
.note-top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.note-title { font-weight:700; font-size:15px; margin:6px 0 3px; }
.note-meta { font-size:12px; color:#807460; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cat { font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; background:#F0E9DD; color:#5E4A36; white-space:nowrap; }
.cat-REQUEST { background:#E8EEF6; color:#3A5A82; }
.cat-ISSUE { background:#FBE4E3; color:#B5322E; }
.cat-FIX { background:#FBF1DC; color:#9A6A1E; }
.pre { white-space:pre-wrap; word-break:break-word; line-height:1.6; font-size:14px; }
.note-body { margin-bottom:14px; }
.note-photo { margin:10px 0 14px; }

function langButtons(){ return [["ko","한국어"],["en","English · Tagalog"]].map(([k,l])=>`<button class="${state.lang===k?'on':''}" onclick="setLang('${k}')">${l}</button>`).join(""); }

const empById = (id) => state.employees.find((e) => String(e.id) === String(id));
const isAdmin = () => state.user?.role === "ADMIN";

function logoHTML(big){
  if (LOGO) return big ? `<img class="login-logo-img" src="${LOGO}" alt="Bahay Cafe">` : `<img class="topbar-logo" src="${LOGO}" alt="Bahay Cafe">`;
  return big ? `<div class="wordmark"><b>☕ Bahay Cafe</b><small>${tl("system_name")}</small></div>` : `<span class="topbar-mark">☕ Bahay Cafe</span>`;
}
function setupError(msg, e){
  const hint = /schema/i.test(e?.message||"") ? `<br><br>👉 Supabase → Settings → API → <b>Exposed schemas</b> 에 <b>cafe</b>, <b>kfr</b> 가 모두 있는지 확인하세요.` : "";

}

async function init() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: SUPABASE_SCHEMA } });
  sbk = sb.schema(SHARED_SCHEMA);
  try {
    await loadEmployees();
    await loadSettings();
  } catch (e) {
    setupError("DB 연결은 됐지만 cafe 테이블을 읽지 못했어요. Supabase SQL Editor 에서 <b>supabase/cafe_schema.sql</b> 을 실행했는지 확인해주세요.", e);
    return;
  }
  // 새로고침해도 로그인 유지 (직원 폰 편의). 비활성/삭제된 계정이면 다시 로그인.
  const saved = empById(localStorage.getItem("cafe_user"));
  if (saved && saved.active !== false) { setUser(saved); renderApp(); }
  else renderLogin();
}
async function loadEmployees(){
  // PIN 은 로그인 순간에만 조회 (목록에는 싣지 않음)
  const { data, error } = await sb.from("employees").select("id,name,name_en,role,active").order("id");
  if (error) throw error;
  state.employees = data || [];
}
async function loadSettings(){
  const { data, error } = await sb.from("app_settings").select("key,value");
  if (error) throw error;
  state.settings = Object.fromEntries((data||[]).map((r) => [r.key, r.value]));
}
async function setSetting(key, value){
  state.settings[key] = value;
  return sb.from("app_settings").upsert({ key, value: String(value) });
}
function toast(msg) { const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

    ${logoHTML(true)}
    <div class="lang-toggle" style="justify-content:center;margin-bottom:18px">${langButtons()}</div>

async function updateEmployee(id, field, value){
  if (field === "pin") { value = String(value).trim(); if (!/^\d{4,8}$/.test(value)) { toast(state.lang==="ko" ? "PIN은 4~8자리 숫자" : "PIN must be 4–8 digits"); return; } }
  if (field === "role" || field === "active") {

    const target = empById(id);
    const losesAdmin = target?.role === "ADMIN" && target.active !== false && ((field === "role" && value !== "ADMIN") || (field === "active" && value === false));
    if (losesAdmin && admins.length <= 1) { toast(state.lang==="ko" ? "마지막 사장 계정은 바꿀 수 없습니다" : "Can't remove the last owner account"); screenManage(); return; }
  }

function getPosition(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("GPS not supported"));
    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  });
}
async function registerStoreLocation(){

    if (!confirm(`${ko?"이 위치를 매장 좌표로 등록할까요?":"Save this as the store location?"}\n${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(accuracy)}m)`)) return;
    const r = await Promise.all([setSetting("store_lat", lat), setSetting("store_lng", lng)]);
    const err = r.find((x) => x.error)?.error;

// ── 출퇴근 (직원): 실시간 사진 + GPS, 시각·거리·인증은 DB 트리거가 결정 ──
const cam = { stream:null, blob:null, url:null, pos:null, posErr:null, posPromise:null };
function stopCamera(){ if (cam.stream) { cam.stream.getTracks().forEach((t) => t.stop()); cam.stream = null; } }
function resetCam(){ stopCamera(); if (cam.url) URL.revokeObjectURL(cam.url); Object.assign(cam, { blob:null, url:null, pos:null, posErr:null, posPromise:null }); }
const durMin = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
const fmtDur = (m) => `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`;
function storeDistance(lat, lng){
  const s = state.settings; if (!s.store_lat || !s.store_lng) return null;
  const R = 6371000, rad = (x) => x * Math.PI / 180, la1 = rad(lat), la2 = rad(Number(s.store_lat));
  const h = Math.sin((la2-la1)/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(rad(Number(s.store_lng)-lng)/2)**2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
const distTxt = (d) => d == null ? "📍 —" : `📍 ${d}m`;
async function openShift(empId){

  if (error) throw error;
  return data?.[0] || null;
}

async function startClockIn(){
  const box = $("camBox");
  if (!navigator.mediaDevices?.getUserMedia) { box.innerHTML = `<div class="err">${tt("cam_unsupported")}</div>`; return; }
  stopCamera();
  // GPS 는 카메라와 동시에 요청 (촬영하는 동안 위치 확보)
  cam.pos = null; cam.posErr = null;
  cam.posPromise = getPosition().then((p) => { cam.pos = p.coords; }).catch((e) => { cam.posErr = e; }).finally(updateGpsLine);
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ ideal:960 }, height:{ ideal:720 } }, audio:false });
  } catch (e) {
    box.innerHTML = `<div class="err">${tt("cam_denied")}</div><button class="btn-ghost" onclick="screenClock()">${tt("cancel")}</button>`; return;
  }
  box.innerHTML = `<div class="cam-wrap"><video id="camVideo" playsinline muted autoplay></video></div>
    <div id="gpsLine" class="gps-line"></div>
    <button class="btn-primary" onclick="capturePhoto()">📸 ${tl("take_photo")}</button>
    <button class="btn-ghost" onclick="screenClock()">${tt("cancel")}</button>`;
  updateGpsLine();
  const v = $("camVideo"); v.srcObject = cam.stream; v.play().catch(() => {});
}
function capturePhoto(){
  const v = $("camVideo"); if (!v || !v.videoWidth) return;
  // 640px · JPEG 60% 로 압축 (용량·egress 절약)
  const scale = Math.min(1, 640 / v.videoWidth), c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  c.toBlob((b) => {
    if (!b) return;
    stopCamera();
    if (cam.url) URL.revokeObjectURL(cam.url);
    cam.blob = b; cam.url = URL.createObjectURL(b);
    $("camBox").innerHTML = `<div class="cam-wrap"><img src="${cam.url}" alt=""></div>
      <div id="gpsLine" class="gps-line"></div>
      <button class="btn-primary" id="confirmIn" onclick="confirmClockIn()">✅ ${tl("clock_in")}</button>
      <button class="btn-ghost" onclick="startClockIn()">↺ ${tt("retake")}</button>`;
    updateGpsLine();
  }, "image/jpeg", 0.6);
}
function updateGpsLine(){
  const el = $("gpsLine"); if (!el) return;
  if (cam.pos) {
    const d = storeDistance(cam.pos.latitude, cam.pos.longitude), fence = Number(state.settings.geofence_m || 100);
    if (d == null) { el.className = "gps-line"; el.textContent = tt("gps_no_store"); return; }
    const ok = d <= fence;
    el.className = "gps-line " + (ok ? "ok" : "warn");
    el.textContent = `📍 ${state.lang==="ko" ? "매장까지" : "Store"} ${d}m (±${Math.round(cam.pos.accuracy)}m) ${ok ? "✅" : "⚠️"}`;
  } else if (cam.posErr) { el.className = "gps-line warn"; el.textContent = tt("gps_fail"); }
  else { el.className = "gps-line"; el.textContent = tt("gps_checking"); }
}
async function confirmClockIn(){

    const uid = state.user.id;

// 사진: 긴 변 1024px · JPEG 70% 로 줄여서 업로드
function compressImage(file, max = 1024, quality = 0.7){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve(b) : reject(new Error("image")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(state.lang==="ko" ? "이미지를 읽을 수 없어요" : "Can't read image")); };
    img.src = url;
  });
}

  if (!confirm(state.lang==="ko" ? "이 글과 댓글을 모두 삭제할까요?" : "Delete this post and its comments?")) return;
  const { data } = await sb.from("notes").select("photo_path").eq("id", id).maybeSingle();

// ── 재고: 현재고 · 입출고 장부 · 저재고 · 주문요청 ──────
const SUP_STATUS = {
  PENDING:{ko:"승인 대기",en:"Pending",tl:"Naghihintay"},
  APPROVED:{ko:"승인됨",en:"Approved",tl:"Aprubado"},
  REJECTED:{ko:"반려",en:"Rejected",tl:"Tinanggihan"},
  CONFIRMED:{ko:"주문 확인",en:"Confirmed",tl:"Nakumpirma"},
  SHIPPING:{ko:"배송중",en:"Shipping",tl:"Pinapadala"},
  DELIVERED:{ko:"배송완료",en:"Delivered",tl:"Naihatid"},
};
const supLabel = (s) => { const e = SUP_STATUS[s]; return !e ? s : (state.lang==="ko" ? e.ko : e.en); };
const supBadge = (s) => `<span class="status s-${esc(s)}">${supLabel(s)}</span>`;
const MOVE_TYPES = { IN:{ko:"입고",en:"In",tl:"Pumasok"}, OUT:{ko:"출고",en:"Out",tl:"Lumabas"}, ADJUST:{ko:"실사",en:"Count",tl:"Bilang"} };
const moveLabel = (t) => state.lang==="ko" ? MOVE_TYPES[t]?.ko : MOVE_TYPES[t]?.en;
const qtyFmt = (n) => { const v = Number(n) || 0; return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0+$/, "").replace(/\.$/, ""); };
const itemName = (i) => !i ? "" : (state.lang==="ko" ? i.name : (i.name_en || i.name));
const isLow = (i) => Number(i.stock) < Number(i.reorder_level);
const reqItemName = (it) => state.lang==="ko" ? it.name : (it.name_en || it.name);
const reqItemsTxt = (items) => (items||[]).map((it) => `${esc(reqItemName(it))} ${qtyFmt(it.qty)}${esc(it.unit||"")}`).join(", ");
// 공급요청에는 이름(text)이 저장됨 → 직원이면 현재 언어 이름으로 표시
const personName = (n) => { const e = state.employees.find((x) => x.name === n); return e ? empName(e) : (n || ""); };
const inv = { items:[], move:{ itemId:"", type:"OUT" }, req:{} };

async function loadInventoryItems(){
  const { data, error } = await sb.from("inventory_items").select("id,name,name_en,unit,stock,reorder_level,active,sort").order("sort").order("id");
  if (error) throw error;
  inv.items = data || [];
}
async function screenInventory(){
  await loadInventoryItems();
  const ko = state.lang === "ko", items = inv.items.filter((i) => i.active !== false);
  const [moves, reqs] = await Promise.all([
    sb.from("inventory_moves").select("id,item_id,type,qty,delta,stock_after,date,note,employee_id,created_at").order("id", { ascending:false }).limit(30),
    sbk.from("supply_requests").select("id,date,items,status,note,requested_by,created_at,status_at,received_at").eq("source","CAFE").order("id", { ascending:false }).limit(10),
  ]);
  if (moves.error) throw moves.error;
  const low = items.filter(isLow);
  if (!inv.move.itemId && items[0]) inv.move.itemId = String(items[0].id);
  const lowBox = low.length ? `<div class="low-box"><b>🔴 ${ko?`주문 필요 ${low.length}품목`:`Low stock: ${low.length}`}</b>
      <div>${low.map((i) => `${esc(itemName(i))} <b>${qtyFmt(i.stock)}</b>/${qtyFmt(i.reorder_level)}${esc(i.unit||"")}`).join(" · ")}</div>
      <button class="btn-mini" onclick="requestLowItems()">📦 ${ko?"부족 품목 주문요청 담기":"Add low items to request"}</button></div>` : "";
  const rows = items.map((i) => `<button class="inv-row ${isLow(i)?"low":""} ${String(i.id)===inv.move.itemId?"sel":""}" onclick="pickMoveItem(${i.id})">
      <span class="inv-name">${esc(itemName(i))}${state.lang==="ko" && i.name_en ? `<span class="m-en">${esc(i.name_en)}</span>` : ""}</span>
      <span class="inv-stock num">${qtyFmt(i.stock)}<small> ${esc(i.unit||"")}</small></span>
      <span class="inv-min muted num">${ko?"최소":"min"} ${qtyFmt(i.reorder_level)}</span></button>`).join("");
  const sel = items.find((i) => String(i.id) === inv.move.itemId);
  const moveCard = items.length ? `<div class="card sticky"><h2>${tl("record_move")}</h2>
      <div class="field"><label for="mvItem">${tl("item")}</label><select id="mvItem" onchange="inv.move.itemId=this.value;screenInventory()">
        ${items.map((i) => `<option value="${i.id}" ${String(i.id)===inv.move.itemId?"selected":""}>${esc(itemName(i))} (${qtyFmt(i.stock)}${esc(i.unit||"")})</option>`).join("")}</select></div>
      <div class="seg" role="radiogroup">${Object.keys(MOVE_TYPES).map((t) => `<button role="radio" aria-checked="${inv.move.type===t}" class="${inv.move.type===t?"on":""} mv-${t}" onclick="setMoveType('${t}')">${moveLabel(t)}${state.lang==="ko"?"":`<span class="lang-sub">${MOVE_TYPES[t].tl}</span>`}</button>`).join("")}</div>
      <div class="field"><label for="mvQty">${inv.move.type==="ADJUST" ? tl("counted_qty") : tl("qty")} ${sel ? `(${esc(sel.unit||"")})` : ""}</label>
        <input id="mvQty" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${esc(inv.move.qty||"")}" oninput="inv.move.qty=this.value"></div>
      <div class="field"><label for="mvNote">${tl("memo")}</label><input id="mvNote" value="${esc(inv.move.note||"")}" oninput="inv.move.note=this.value" placeholder="${ko?"예: 시장 구매, 폐기, 실사":"e.g. market purchase, waste"}"></div>
      <button class="btn-primary" id="mvSave" onclick="saveMove()">${tl("save")}</button>
      <p class="hint">${inv.move.type==="ADJUST" ? (ko?"실사: 실제로 세어 본 수량을 입력하면 현재고가 그 수량으로 맞춰집니다.":"Count: enter the actual counted amount; stock is set to it.") : (ko?"입고는 더하고, 출고는 뺍니다.":"In adds, Out subtracts.")}</p></div>` : "";
  const ledger = (moves.data||[]).map((m) => {
    const it = inv.items.find((i) => i.id === m.item_id), d = Number(m.delta ?? 0);
    return `<tr><td>${m.date.slice(5)}</td><td>${esc(itemName(it))}</td><td><span class="mv-tag mv-${m.type}">${moveLabel(m.type)}</span></td>
      <td class="num ${d>=0?"pos":"neg"}">${d>0?"+":""}${qtyFmt(d)}</td><td class="num">${qtyFmt(m.stock_after)}</td>
      <td>${esc(empName(empById(m.employee_id)))}${m.note ? `<div class="muted">${esc(m.note)}</div>` : ""}</td>
      ${isAdmin() ? `<td><button class="link-del" aria-label="delete" onclick="delMove(${m.id})">✕</button></td>` : ""}</tr>`;
  }).join("");
  const reqList = reqs.error ? `<div class="setup-note">⚠️ ${esc(reqs.error.message)}</div>` : (reqs.data||[]).map((r) => `<div class="order-card">
      <div class="order-top"><span class="muted">${r.date} · ${esc(personName(r.requested_by))}</span>${supBadge(r.status)}</div>
      ${supSteps(r)}
      <div class="order-items">${(r.items||[]).map((it) => `<span class="chip">${esc(reqItemName(it))} ×${qtyFmt(it.qty)}${esc(it.unit||"")}</span>`).join("")}</div>
      ${r.note ? `<div class="pre muted">${esc(r.note)}</div>` : ""}
      ${r.status==="PENDING" && (isAdmin() || r.requested_by===state.user.name) ? `<div class="order-foot"><span></span><button class="mng-del" onclick="cancelRequest(${r.id})">${ko?"요청 취소":"Cancel request"}</button></div>` : ""}
      ${receiveHTML(r)}
    </div>`).join("");
  $("screen").innerHTML = `<div class="report-title">${tt("tab_inventory")}</div>
    ${lowBox}
    <div class="grid-2">
      <div class="card"><h2>${tl("current_stock")}</h2>${rows || `<p class="empty">${ko?"등록된 품목이 없습니다.":"No items yet."}${isAdmin()?"":(ko?" 사장님께 품목 등록을 요청하세요.":" Ask the owner to add items.")}</p>`}</div>
      ${moveCard}
    </div>
    <div class="card" id="reqCard"><h2>📦 ${tl("order_request")}</h2>${requestFormHTML(items)}</div>
    <div class="card"><h2>${tl("my_requests")}</h2>${reqList || `<p class="empty">—</p>`}</div>
    <div class="card"><h2>${tl("ledger")}</h2>${ledger ? `<div class="tscroll"><table class="data-table">
      <thead><tr><th>${ko?"날짜":"Date"}</th><th>${tt("item")}</th><th></th><th class="num">±</th><th class="num">${ko?"재고":"Stock"}</th><th>${ko?"담당":"By"}</th>${isAdmin()?"<th></th>":""}</tr></thead>
      <tbody>${ledger}</tbody></table></div>` : `<p class="empty">—</p>`}</div>
    ${isAdmin() ? itemAdminHTML() : ""}`;
}
function setMoveType(t){ inv.move.type = t; screenInventory(); }
function pickMoveItem(id){ inv.move.itemId = String(id); screenInventory().then(() => $("mvQty")?.focus()); }
async function saveMove(){
  const qty = Number($("mvQty").value), note = $("mvNote").value.trim();
  if (!(qty > 0) && !(inv.move.type === "ADJUST" && $("mvQty").value !== "" && qty === 0)) { toast(state.lang==="ko" ? "수량을 입력하세요" : "Enter a quantity"); return; }
  const btn = $("mvSave"); btn.disabled = true;
  const { data, error } = await sb.from("inventory_moves").insert({ item_id: Number(inv.move.itemId), type: inv.move.type, qty, note: note || null, employee_id: state.user.id }).select("stock_after").single();
  if (error) { toast(tt("save_fail") + error.message); btn.disabled = false; return; }
  const it = inv.items.find((i) => String(i.id) === inv.move.itemId);
  inv.move.qty = ""; inv.move.note = "";
  toast(`${tt("saved")} · ${itemName(it)} ${qtyFmt(data.stock_after)}${it?.unit||""}`);
  screenInventory();
}
async function delMove(id){
  if (!confirm(state.lang==="ko" ? "이 기록을 삭제할까요? 재고가 그만큼 되돌아갑니다." : "Delete this entry? Stock will be reverted.")) return;
  const { error } = await sb.from("inventory_moves").delete().eq("id", id);
  if (error) { toast(error.message); return; }
  screenInventory();
}

// 주문요청 (→ kfr.supply_requests, source=CAFE, PENDING)
function requestFormHTML(items){
  const ko = state.lang === "ko";
  const picked = Object.entries(inv.req).filter(([, q]) => Number(q) > 0);
  return `<div class="add-form">
      <select id="rqItem" aria-label="item"><option value="">${ko?"품목 선택":"Choose item"}</option>
        ${items.map((i) => `<option value="${i.id}">${esc(itemName(i))}${isLow(i)?" 🔴":""}</option>`).join("")}</select>
      <input id="rqQty" type="number" inputmode="decimal" min="0" step="any" placeholder="${ko?"수량":"Qty"}" style="max-width:90px">
      <button class="btn-mini" onclick="addReqItem()">${ko?"담기":"Add"}</button></div>
    <div class="order-items">${picked.map(([id, q]) => { const i = inv.items.find((x) => String(x.id) === id);
      return `<span class="chip">${esc(itemName(i))} ×${qtyFmt(q)}${esc(i?.unit||"")} <button class="chip-x" aria-label="remove" onclick="delete inv.req['${id}'];screenInventory()">✕</button></span>`; }).join("")}</div>
    <div class="field"><label for="rqNote">${tl("memo")}</label><textarea id="rqNote" rows="2" oninput="inv.reqNote=this.value" placeholder="${ko?"예: 금요일까지 필요":"e.g. needed by Friday"}">${esc(inv.reqNote||"")}</textarea></div>
    <button class="btn-primary" id="rqSave" onclick="submitRequest()" ${picked.length?"":"disabled"}>${tl("send_request")}</button>
    <p class="hint">${ko?"사장님이 승인하면 K-Food 주문함으로 넘어갑니다.":"After the owner approves, it goes to the K-Food order list."}</p>`;
}
function addReqItem(){
  const id = $("rqItem").value, q = Number($("rqQty").value);
  if (!id || !(q > 0)) { toast(state.lang==="ko" ? "품목과 수량을 입력하세요" : "Choose an item and quantity"); return; }
  inv.req[id] = (Number(inv.req[id]) || 0) + q; screenInventory().then(() => $("reqCard")?.scrollIntoView({ block:"center" }));
}
function requestLowItems(){
  inv.items.filter((i) => i.active !== false && isLow(i)).forEach((i) => {
    if (!(Number(inv.req[i.id]) > 0)) inv.req[i.id] = Math.max(1, Number(i.reorder_level) * 2 - Number(i.stock));
  });
  screenInventory().then(() => $("reqCard")?.scrollIntoView({ block:"center" }));
}
async function submitRequest(){
  const items = Object.entries(inv.req).filter(([, q]) => Number(q) > 0).map(([id, q]) => {
    const i = inv.items.find((x) => String(x.id) === id); return { item_id: Number(id), name: i?.name || id, name_en: i?.name_en || null, qty: Number(q), unit: i?.unit || "" };
  });
  if (!items.length) return;
  const btn = $("rqSave"); btn.disabled = true;
  const { error } = await sbk.from("supply_requests").insert({ source:"CAFE", requested_by: state.user.name, date: today(), items, status:"PENDING", note: $("rqNote").value.trim() || null });
  if (error) { toast(tt("save_fail") + error.message); btn.disabled = false; return; }
  inv.req = {}; inv.reqNote = ""; toast(state.lang==="ko" ? "주문요청을 보냈습니다" : "Request sent / Naipadala"); screenInventory();
}
async function cancelRequest(id){
  if (!confirm(state.lang==="ko" ? "이 요청을 취소할까요?" : "Cancel this request?")) return;
  const { error } = await sbk.from("supply_requests").delete().eq("id", id).eq("status", "PENDING");
  if (error) { toast(error.message); return; }
  screenRefresh();
}
function screenRefresh(){ renderScreen(); }

// 품목 관리 (사장)
function itemAdminHTML(){
  const ko = state.lang === "ko";
  const rows = inv.items.map((i) => `<div class="item-row ${i.active===false?"off":""}">
      <div><b>${esc(i.name)}</b>${i.name_en ? `<span class="m-en">${esc(i.name_en)}</span>` : ""}</div>
      <input aria-label="unit" value="${esc(i.unit||"")}" onchange="updateItem(${i.id},'unit',this.value.trim())">
      <input aria-label="reorder level" type="number" min="0" step="any" value="${qtyFmt(i.reorder_level)}" onchange="updateItem(${i.id},'reorder_level',Number(this.value)||0)">
      <button class="mng-del" onclick="updateItem(${i.id},'active',${i.active===false})">${i.active===false?(ko?"복구":"Restore"):(ko?"숨김":"Hide")}</button></div>`).join("");
  return `<div class="card"><h2>${ko?"품목 관리":"Items"}</h2>
    <div class="add-form">
      <input id="itName" placeholder="${ko?"품목명":"Name"}"><input id="itNameEn" placeholder="${ko?"영문명":"English name"}">
      <input id="itUnit" placeholder="${ko?"단위 (kg, 팩)":"Unit"}" style="max-width:90px">
      <input id="itMin" type="number" min="0" step="any" placeholder="${ko?"최소재고":"Min"}" style="max-width:90px">
      <input id="itStock" type="number" min="0" step="any" placeholder="${ko?"현재고":"Stock"}" style="max-width:90px">
      <button class="btn-mini" onclick="addItem()">${ko?"추가":"Add"}</button></div>
    <div class="item-row head muted"><span>${ko?"품목":"Item"}</span><span>${ko?"단위":"Unit"}</span><span>${ko?"최소재고":"Min stock"}</span><span></span></div>
    ${rows || `<p class="empty">—</p>`}
    <p class="hint">${ko?"최소재고보다 적으면 대시보드와 재고 화면에 빨간 경고가 뜹니다. 현재고는 입출고/실사 기록으로만 바뀝니다.":"Below min stock shows a red alert. Stock only changes through in/out/count entries."}</p></div>`;
}
async function addItem(){
  const name = $("itName").value.trim(); if (!name) { toast(state.lang==="ko" ? "품목명을 입력하세요" : "Enter a name"); return; }
  const stock = $("itStock").value === "" ? null : Number($("itStock").value);
  const { data, error } = await sb.from("inventory_items").insert({ name, name_en: $("itNameEn").value.trim() || null, unit: $("itUnit").value.trim() || "개",
    reorder_level: Number($("itMin").value) || 0, stock: 0, sort: inv.items.length + 1 }).select("id").single();
  if (error) { toast(tt("save_fail") + error.message); return; }
  if (stock > 0) await sb.from("inventory_moves").insert({ item_id: data.id, type:"ADJUST", qty: stock, note: state.lang==="ko" ? "최초 재고" : "Opening stock", employee_id: state.user.id });
  toast(tt("saved")); screenInventory();
}
async function updateItem(id, field, value){
  const { error } = await sb.from("inventory_items").update({ [field]: value }).eq("id", id);
  if (error) { toast(tt("save_fail") + error.message); return; }
  toast(tt("saved")); screenInventory();
}

// ── 공급요청 승인 (사장) ─────────────────────────
async function screenSupply(){
  const ko = state.lang === "ko";
  const { data, error } = await sbk.from("supply_requests").select("id,date,items,status,note,requested_by,approved_by,decided_at,created_at,status_at,received_at")
    .eq("source","CAFE").order("id", { ascending:false }).limit(60);
  if (error) throw error;
  const pending = (data||[]).filter((r) => r.status === "PENDING"), rest = (data||[]).filter((r) => r.status !== "PENDING");
  const card = (r) => `<div class="order-card">
      <div class="order-top"><span><b>${esc(personName(r.requested_by))}</b> <span class="muted">${r.date} · ${ago(r.created_at)}</span></span>${supBadge(r.status)}</div>
      ${supSteps(r)}
      <div class="order-items">${(r.items||[]).map((it) => `<span class="chip">${esc(reqItemName(it))} ×${qtyFmt(it.qty)}${esc(it.unit||"")}</span>`).join("")}</div>
      ${r.note ? `<div class="pre" style="font-size:13px;margin-bottom:8px">${esc(r.note)}</div>` : ""}
      ${r.status === "PENDING" ? `<div class="order-foot"><button class="mng-del" onclick="decideRequest(${r.id},'REJECTED')">${ko?"반려":"Reject"}</button>
        <button class="btn-mini on" onclick="decideRequest(${r.id},'APPROVED')">✓ ${ko?"승인 → K-Food로":"Approve → K-Food"}</button></div>`
        : `<div class="muted">${r.approved_by ? `${ko?"결정":"By"}: ${esc(personName(r.approved_by))}` : ""}${r.status_at ? ` · ${ago(r.status_at)}` : ""}</div>${receiveHTML(r)}`}
    </div>`;
  $("screen").innerHTML = `<div class="report-title">${tt("tab_supply")} <span>· ☕ Bahay Cafe → K-Food</span></div>
    <div class="card"><h2>${ko?"승인 대기":"Pending"} ${pending.length ? `<span class="dot-red">${pending.length}</span>` : ""}</h2>
      ${pending.map(card).join("") || `<p class="empty">${ko?"대기 중인 요청이 없습니다.":"Nothing to approve."}</p>`}</div>
    <div class="card"><h2>${ko?"처리 내역":"History"}</h2>${rest.map(card).join("") || `<p class="empty">—</p>`}
      <p class="hint">${ko?"승인된 요청은 K-Food 주문함에 ☕카페로 표시되고, 담당자가 확인→배송→완료로 진행합니다.":"Approved requests appear in K-Food as ☕Cafe and move through Confirmed → Shipping → Delivered."}</p></div>`;
}
async function decideRequest(id, status){
  const ko = state.lang === "ko";
  const patch = { status, approved_by: state.user.name, decided_at: new Date().toISOString() };
  if (status === "REJECTED") {
    const reason = prompt(ko ? "반려 사유 (선택)" : "Reason (optional)", "");
    if (reason === null) return;
    if (reason.trim()) {
      const { data } = await sbk.from("supply_requests").select("note").eq("id", id).single();
      patch.note = [data?.note, `[${ko?"반려":"Rejected"}] ${reason.trim()}`].filter(Boolean).join("\n");
    }
  }
  const { data, error } = await sbk.from("supply_requests").update(patch).eq("id", id).eq("status", "PENDING").select("id");
  if (error) { toast(tt("save_fail") + error.message); return; }
  if (!data?.length) toast(ko ? "이미 처리된 요청입니다" : "Already handled");
  else toast(status === "APPROVED" ? (ko ? "승인 — K-Food 주문함으로 보냈습니다" : "Approved — sent to K-Food") : (ko ? "반려했습니다" : "Rejected"));
  screenSupply();
}


// 진행 단계 막대 + 배송완료 건 '입고 처리' (K-Food → 카페 재고 IN)
const SUP_FLOW = ["PENDING","APPROVED","CONFIRMED","SHIPPING","DELIVERED"];
function supSteps(r){
  if (r.status === "REJECTED") return "";
  const i = SUP_FLOW.indexOf(r.status);
  return `<div class="sup-steps" aria-label="${esc(supLabel(r.status))}">${SUP_FLOW.map((s, k) => `<span class="${k<=i?"on":""}" title="${esc(supLabel(s))}"></span>`).join("")}</div>`;
}
function receiveHTML(r){
  const ko = state.lang === "ko";
  if (r.status !== "DELIVERED") return "";
  if (r.received_at) return `<div class="done-mark" style="margin-top:6px">✅ ${ko?"입고 완료":"Received"} · ${ago(r.received_at)}</div>`;
  return `<button class="btn-primary" style="margin-top:8px" onclick="receiveRequest(${r.id})">📥 ${tl("receive_stock")}</button>`;
}
async function receiveRequest(id){
  const ko = state.lang === "ko";
  const { data: r, error } = await sbk.from("supply_requests").select("id,items,status,received_at").eq("id", id).single();
  if (error) { toast(error.message); return; }
  if (r.status !== "DELIVERED" || r.received_at) { toast(ko ? "이미 처리된 요청입니다" : "Already received"); return renderScreen(); }
  const items = (r.items||[]).filter((it) => it.item_id && Number(it.qty) > 0);
  if (!confirm(`${ko?"아래 수량을 재고에 입고할까요?":"Add these to stock?"}\n\n${(r.items||[]).map((it) => `· ${reqItemName(it)} +${qtyFmt(it.qty)}${it.unit||""}`).join("\n")}\n\n${ko?"실제 받은 수량이 다르면 입고 후 '실사'로 맞춰 주세요.":"If the delivered amount differs, fix it with a Count afterwards."}`)) return;
  // 1) 재고 입고 기록 → 2) 요청에 입고완료 표시 (2가 실패하면 1을 되돌림)
  let moveIds = [];
  if (items.length) {
    const ins = await sb.from("inventory_moves").insert(items.map((it) => ({ item_id: it.item_id, type:"IN", qty: Number(it.qty),
      note: `${ko?"공급요청":"Supply request"} #${id}`, employee_id: state.user.id }))).select("id");
    if (ins.error) { toast(tt("save_fail") + ins.error.message); return; }
    moveIds = (ins.data||[]).map((m) => m.id);
  }
  const claim = await sbk.from("supply_requests").update({ received_at: new Date().toISOString() }).eq("id", id).eq("status","DELIVERED").is("received_at", null).select("id");
  if (claim.error || !claim.data?.length) {
    if (moveIds.length) await sb.from("inventory_moves").delete().in("id", moveIds);
    toast(claim.error ? tt("save_fail") + claim.error.message : (ko ? "이미 처리된 요청입니다" : "Already received"));
    return renderScreen();
  }
  toast(ko ? "입고 처리했습니다" : "Received into stock"); renderScreen();
}

function monthsEnding(month, n){ const out = []; let [y, m] = month.split("-").map(Number); for (let k = 0; k < n; k++) { out.unshift(`${y}-${String(m).padStart(2,"0")}`); if (--m === 0) { m = 12; y--; } } return out; }

    if (id.startsWith("_")) return;

function clRowHTML(m){

    ${chartDates.length ? `<div class="card">${svgBars(chartDates.map((d) => d.slice(8)), chartDates.map((d) => byDate[d] ? closingTotal(byDate[d]) : 0))}</div>` : ""}
    <div class="card"><div class="tscroll"><table class="data-table">
      <thead><tr><th>${ko?"날짜":"Date"}</th><th class="num">${ko?"현금":"Cash"}</th><th class="num">GCash</th><th class="num">${ko?"카드/기타":"Card"}</th><th class="num">${ko?"매출":"Sales"}</th><th class="num">${ko?"지출":"Exp."}</th><th class="num">${ko?"순이익":"Net"}</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7" class="empty">—</td></tr>`}
      <tr class="att-total"><td>${ko?"합계":"Total"}</td><td class="num">${fmt(tot.cash)}</td><td class="num">${fmt(tot.gcash)}</td><td class="num">${fmt(tot.card)}</td><td class="num">${fmt(tot.sales)}</td><td class="num">${fmt(tot.exp)}</td><td class="num">${fmt(tot.sales-tot.exp)}</td></tr></tbody></table></div>
      <p class="hint">${ko?"날짜를 누르면 그날 마감을 열어 수정할 수 있어요.":"Tap a day to open and edit its closing."}</p></div>`;
}
function svgBars(labels, values){
  const W = 720, H = 260, pl = 78, pr = 8, pt = 16, pb = 36, iw = W-pl-pr, ih = H-pt-pb, max = Math.max(...values, 1), n = labels.length, bw = iw/n;
  let g = "";
  for (let i = 0; i <= 3; i++) { const y = pt + ih - ih*i/3; g += `<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#EEE6DA"/><text x="${pl-8}" y="${y+7}" text-anchor="end" font-size="20" fill="#807460">${kfmt(max*i/3)}</text>`; }
  const bars = values.map((v, i) => { const h = ih * v / max, x = pl + i*bw + bw*0.15; return `<rect x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"><title>${labels[i]} · ${fmt(v)}</title></rect>`; }).join("");
  const step = Math.ceil(n / 8);
  const xl = labels.map((l, i) => i % step ? "" : `<text x="${(pl + i*bw + bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="20" fill="#807460">${l}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="daily sales">${g}${bars}${xl}</svg>`;
}
function svgTrend(labels, series){
  const W = 720, H = 340, pl = 86, pr = 24, pt = 20, pb = 42, iw = W-pl-pr, ih = H-pt-pb;
  const all = series.flatMap((s) => s.values), max = Math.max(...all, 1), min = Math.min(0, ...all);
  const x = (i) => pl + (labels.length <= 1 ? iw/2 : iw*i/(labels.length-1)), y = (v) => pt + ih - ((v-min)/((max-min)||1))*ih;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = min + (max-min)*i/4, yy = pt + ih - ih*i/4; g += `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="#EEE6DA"/><text x="${pl-10}" y="${(yy+7).toFixed(1)}" text-anchor="end" font-size="20" fill="#807460">${kfmt(v)}</text>`; }
  const xl = labels.map((l, i) => `<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="20" fill="#807460">${l}</text>`).join("");
  const lines = series.map((s) => `<polyline points="${s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="4" stroke-linejoin="round"/>` +
    s.values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="6" fill="${s.color}"><title>${labels[i]} · ${s.name} ${fmt(v)}</title></circle>`).join("")).join("");
  return `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="trend">${g}${lines}${xl}</svg>`;
}

// ── 메뉴 순위 ──
async function screenMenuRank(){
  await loadMenus();
  const month = sales.rankMonth ||= thisMonth(), { start, end } = monthRange(month), ko = state.lang === "ko";
  const { data, error } = await sb.from("closings").select("items").gte("date", start).lt("date", end);
  if (error) throw error;
  const agg = {};
  (data||[]).forEach((c) => Object.entries(closingLines(c.items)).forEach(([id, o]) => { const a = (agg[id] ||= { q:0, rev:0, free:0 }); a.q += o.q; a.rev += o.rev; a.free += o.free; }));
  const by = sales.rankBy, list = Object.entries(agg).map(([id, o]) => ({ id, ...o, m: menuById(id) })).sort((a, b) => (by === "rev" ? b.rev - a.rev : (b.q + b.free) - (a.q + a.free)));
  const max = Math.max(...list.map((r) => by === "rev" ? r.rev : r.q + r.free), 1), totQ = list.reduce((s, r) => s + r.q, 0), totR = list.reduce((s, r) => s + r.rev, 0);
  const catAgg = {}; list.forEach((r) => { const c = menuCat(r.m); catAgg[c] = (catAgg[c]||0) + r.rev; });
  $("screen").innerHTML = `<div class="report-title">${tt("tab_menurank")} <span>· ${month}</span></div>
    <div class="filter-bar"><input type="month" value="${month}" max="${thisMonth()}" aria-label="month" onchange="sales.rankMonth=this.value;screenMenuRank()">
      <div class="fchips" style="margin:0">${[["q", ko?"판매 수량":"By quantity"], ["rev", ko?"매출액":"By revenue"]].map(([k, l]) => `<button class="fchip ${by===k?"on":""}" onclick="sales.rankBy='${k}';screenMenuRank()">${l}</button>`).join("")}</div></div>
    <div class="grid-2">
      <div class="card"><h2>${ko?"메뉴별":"By menu"} <span class="muted">${totQ}${ko?"잔/개":" sold"} · ${fmt(totR)}</span></h2>
        ${list.map((r, i) => { const v = by === "rev" ? r.rev : r.q + r.free; return `<div class="bar-row rank-row"><span class="bar-name"><b class="rank-no">${i+1}</b>${esc(menuName(r.m) || r.id)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(1)}%"></div></div>
          <span class="bar-val">${by === "rev" ? fmt(r.rev) : `${r.q}${r.free ? ` <small class="muted">+🎁${r.free}</small>` : ""}`}</span></div>`; }).join("") || `<p class="empty">${ko?"이 달의 마감 기록이 없습니다.":"No closings this month."}</p>`}
      </div>
      <div class="card"><h2>${ko?"분류별 매출":"Sales by category"}</h2>
        ${Object.keys(MENU_CATS).filter((c) => catAgg[c]).map((c) => `<div class="ebar-row"><span class="ebar-name">${menuCatLabel(c)}</span><div class="ebar-track"><div class="ebar-fill" style="width:${(catAgg[c]/(totR||1)*100).toFixed(1)}%"></div></div><span class="ebar-val">${Math.round(catAgg[c]/(totR||1)*100)}%</span></div>`).join("") || `<p class="empty">—</p>`}
        <p class="hint">🎁 ${ko?"= 쿠폰/무료 제공 수량 (매출 0, 수량 순위에만 포함)":"= free/coupon items (₱0, counted in quantity only)"}</p></div>
    </div>`;
}

// ── 월별 보고서 ──
async function screenReport(){
  await loadMenus();
  const month = sales.repMonth ||= thisMonth(), months = monthsEnding(month, 6), ko = state.lang === "ko";
  const first = monthRange(months[0]).start, { end, prev } = monthRange(month);
  const [cs, ex] = await Promise.all([
    sb.from("closings").select("date,cash,gcash,card,items").gte("date", first).lt("date", end),
    sb.from("expenses").select("date,category,amount").gte("date", first).lt("date", end),
  ]);
  if (cs.error) throw cs.error;
  const stat = (mo) => {
    const c = (cs.data||[]).filter((x) => x.date.startsWith(mo)), e = (ex.data||[]).filter((x) => x.date.startsWith(mo));
    const s = { cash:0, gcash:0, card:0, sales:0, exp:0, days:c.length, byCat:{}, wd:[0,0,0,0,0,0,0], wdN:[0,0,0,0,0,0,0], lines:{} };
    c.forEach((x) => { s.cash += Number(x.cash); s.gcash += Number(x.gcash); s.card += Number(x.card||0); const t = closingTotal(x); s.sales += t; const w = new Date(x.date+"T00:00:00").getDay(); s.wd[w] += t; s.wdN[w]++;
      Object.entries(closingLines(x.items)).forEach(([id, o]) => { const a = (s.lines[id] ||= { q:0, rev:0 }); a.q += o.q; a.rev += o.rev; }); });
    e.forEach((x) => { s.exp += Number(x.amount); s.byCat[x.category] = (s.byCat[x.category]||0) + Number(x.amount); });
    s.profit = s.sales - s.exp; s.margin = s.sales ? s.profit / s.sales * 100 : 0;
    return s;
  };
  const cur = stat(month), pv = months.includes(prev) ? stat(prev) : null;
  const delta = (a, b, lowerIsBetter) => { if (!pv) return ""; if (!b) return `<div class="delta flat">—</div>`; const p = (a-b)/Math.abs(b)*100, good = lowerIsBetter ? -p : p; return `<div class="delta ${good>0.5?"up":good<-0.5?"down":"flat"}">${p>0?"▲":p<0?"▼":"–"} ${Math.abs(p).toFixed(0)}% ${ko?"전월 대비":"vs last month"}</div>`; };
  const expCats = Object.entries(cur.byCat).sort((a, b) => b[1] - a[1]), expMax = Math.max(...expCats.map((e) => e[1]), 1);
  const top = Object.entries(cur.lines).sort((a, b) => b[1].rev - a[1].rev).slice(0, 5);
  const wdAvg = cur.wd.map((v, i) => cur.wdN[i] ? v / cur.wdN[i] : 0), wdMax = Math.max(...wdAvg, 1);
  const trend = months.map(stat);
  $("screen").innerHTML = `<div class="report-title">${tt("tab_report")} <span>· ${month}</span></div>
    <div class="filter-bar"><input type="month" value="${month}" max="${thisMonth()}" aria-label="month" onchange="sales.repMonth=this.value;screenReport()"></div>
    <div class="kpi-row four">
      <div class="kpi accent"><div class="kpi-label">${ko?"매출":"Sales"}</div><div class="kpi-value">${fmt(cur.sales)}</div>${delta(cur.sales, pv?.sales)}</div>
      <div class="kpi"><div class="kpi-label">${ko?"지출":"Expenses"}</div><div class="kpi-value">${fmt(cur.exp)}</div>${delta(cur.exp, pv?.exp, true)}</div>
      <div class="kpi"><div class="kpi-label">${ko?"순이익":"Profit"}</div><div class="kpi-value" style="color:${cur.profit>=0?"#1F7A43":"#B5322E"}">${fmt(cur.profit)}</div>${delta(cur.profit, pv?.profit)}</div>
      <div class="kpi"><div class="kpi-label">${ko?"이익률":"Margin"}</div><div class="kpi-value">${cur.margin.toFixed(1)}%</div><div class="delta flat">${cur.days}${ko?"일 영업 · 일평균 ":" days · avg "}${fmt(cur.days ? Math.round(cur.sales/cur.days) : 0)}</div></div>
    </div>
    <div class="grid-2">
      <div class="card report-pl"><h2>${ko?"손익":"Profit & loss"}</h2>
        <div class="pl-row"><span>${ko?"매출":"Sales"}</span><b>${fmt(cur.sales)}</b></div>
        <div class="pl-row pl-sub"><span>${ko?"현금":"Cash"}</span><span class="num">${fmt(cur.cash)}</span></div>
        <div class="pl-row pl-sub"><span>GCash</span><span class="num">${fmt(cur.gcash)}</span></div>
        <div class="pl-row pl-sub"><span>${ko?"카드/기타":"Card / other"}</span><span class="num">${fmt(cur.card)}</span></div>
        <div class="pl-row"><span>${ko?"지출":"Expenses"}</span><b>−${fmt(cur.exp)}</b></div>
        ${expCats.map(([c, v]) => `<div class="ebar-row pl-sub"><span class="ebar-name">${esc(expCatLabel(c))}</span><div class="ebar-track"><div class="ebar-fill" style="width:${(v/expMax*100).toFixed(1)}%"></div></div><span class="ebar-val">${fmt(v)}</span></div>`).join("")}
        <div class="pl-row total"><span>${ko?"순이익":"Profit"}</span><b style="color:${cur.profit>=0?"#1F7A43":"#B5322E"}">${fmt(cur.profit)}</b></div>
      </div>
      <div class="card"><h2>${ko?"매출 상위 메뉴":"Top menu items"}</h2>
        ${top.map(([id, o], i) => `<div class="prev-row"><span><b class="rank-no">${i+1}</b>${esc(menuName(menuById(id)) || id)} <span class="muted">×${o.q}</span></span><b>${fmt(o.rev)}</b></div>`).join("") || `<p class="empty">—</p>`}
        <div class="section-label">${ko?"요일별 평균 매출":"Average sales by weekday"}</div>
        ${[1,2,3,4,5,6,0].map((w) => `<div class="ebar-row"><span class="ebar-name">${WEEKDAYS[ko?"ko":"en"][w]}</span><div class="ebar-track"><div class="bar-fill" style="width:${(wdAvg[w]/wdMax*100).toFixed(1)}%"></div></div><span class="ebar-val">${wdAvg[w] ? kfmt(wdAvg[w]) : "—"}</span></div>`).join("")}
      </div>
    </div>
    <div class="card"><h2>${ko?"최근 6개월":"Last 6 months"}</h2>
      ${svgTrend(months.map((m) => m.slice(2).replace("-", ".")), [
        { name: ko?"매출":"Sales", color:"#8B4A25", values: trend.map((t) => t.sales) },
        { name: ko?"지출":"Expenses", color:"#C9842A", values: trend.map((t) => t.exp) },
        { name: ko?"순이익":"Profit", color:"#1F7A43", values: trend.map((t) => t.profit) }])}</div>`;
}

// ── 관리: 메뉴 · 지출 ──
async function manageSalesHTML(){
  await loadMenus();
  const ko = state.lang === "ko", month = sales.expMonth ||= thisMonth(), { start, end } = monthRange(month);
  const { data: exps } = await sb.from("expenses").select("id,date,category,amount,note,created_by").gte("date", start).lt("date", end).order("date", { ascending:false }).order("id", { ascending:false });
  const menuRows = Object.keys(MENU_CATS).map((c) => {
    const ms = (state.menusAll||[]).filter((m) => menuCat(m) === c); if (!ms.length) return "";
    return `<div class="section-label">${menuCatLabel(c)}</div>` + ms.map((m) => `<div class="menu-mng ${m.active===false?"off":""}">
      <div><b>${esc(m.name)}</b>${m.name_en ? `<span class="m-en">${esc(m.name_en)}</span>` : ""}</div>
      <select aria-label="category" onchange="updateMenu('${esc(m.id)}','category',this.value)">${Object.keys(MENU_CATS).map((k) => `<option value="${k}" ${menuCat(m)===k?"selected":""}>${menuCatLabel(k)}</option>`).join("")}</select>
      <div class="peso-field"><span>${PESO}</span><input type="number" inputmode="decimal" min="0" aria-label="price" value="${Number(m.price)}" onchange="updateMenu('${esc(m.id)}','price',Number(this.value)||0)"></div>
      <button class="mng-del" onclick="updateMenu('${esc(m.id)}','active',${m.active===false})">${m.active===false?(ko?"복구":"Restore"):(ko?"숨김":"Hide")}</button></div>`).join("");
  }).join("");
  const expTotal = (exps||[]).reduce((s, e) => s + Number(e.amount), 0);
  return `<div class="card"><h2>☕ ${ko?"메뉴":"Menu"}</h2>
      <div class="add-form">
        <input id="mnName" placeholder="${ko?"메뉴명":"Name"}"><input id="mnNameEn" placeholder="${ko?"영문명":"English name"}">
        <select id="mnCat" aria-label="category">${Object.keys(MENU_CATS).map((k) => `<option value="${k}">${menuCatLabel(k)}</option>`).join("")}</select>
        <input id="mnPrice" type="number" inputmode="decimal" min="0" placeholder="${PESO}" style="max-width:90px">
        <button class="btn-mini" onclick="addMenu()">${ko?"추가":"Add"}</button></div>
      ${menuRows || `<p class="empty">${ko?"메뉴가 없습니다.":"No menu items."}</p>`}
      <p class="hint">${ko?"가격을 바꿔도 지난 마감 매출은 그대로입니다(마감 때 단가를 함께 저장). 안 파는 메뉴는 '숨김'.":"Changing a price doesn't change past closings. Hide items you no longer sell."}</p></div>
    <div class="card"><div class="card-head"><h2>💸 ${ko?"지출":"Expenses"} <span class="muted">${fmt(expTotal)}</span></h2>
        <input type="month" value="${month}" max="${thisMonth()}" aria-label="month" onchange="sales.expMonth=this.value;renderScreen()" style="border:1px solid #D8CDBD;border-radius:9px;padding:6px 8px"></div>
      ${expenseFormHTML("mx", true)}
      ${(exps||[]).map((e) => `<div class="prev-row"><span>${e.date.slice(5)} · ${esc(expCatLabel(e.category))}${e.note ? ` <span class="muted">· ${esc(e.note)}</span>` : ""}${e.created_by ? ` <span class="muted">· ${esc(empName(empById(e.created_by)))}</span>` : ""}</span>
        <span><b>${fmt(e.amount)}</b> <button class="link-del" aria-label="delete" onclick="delExpense(${e.id})">✕</button></span></div>`).join("") || `<p class="empty">—</p>`}</div>`;
}
async function addMenu(){
  const name = $("mnName").value.trim(), price = Number($("mnPrice").value);
  if (!name || !(price >= 0) || $("mnPrice").value === "") { toast(state.lang==="ko" ? "메뉴명과 가격을 입력하세요" : "Enter a name and price"); return; }
  const id = "m" + Date.now().toString(36);
  const { error } = await sb.from("menus").insert({ id, name, name_en: $("mnNameEn").value.trim() || null, price, category: $("mnCat").value, sort: (state.menusAll||[]).length + 1 });
  if (error) { toast(tt("save_fail") + error.message); return; }
  toast(tt("saved")); renderScreen();
}
async function updateMenu(id, field, value){
  const { error } = await sb.from("menus").update({ [field]: value }).eq("id", id);
  if (error) { toast(tt("save_fail") + error.message); return; }
  toast(tt("saved")); renderScreen();
}

init();
