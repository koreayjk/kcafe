<script>
// ════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════
const SUPABASE_URL = "https://lnrugwschlcesaaertgc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxucnVnd3NjaGxjZXNhYWVydGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODczNzgsImV4cCI6MjA5NjA2MzM3OH0.JTpEUF2TO2NcuS1ak04hqd2IYfZ2bYn40L3EaLIwVGw";

//  두 스키마 모두 Settings → API → Exposed schemas 에 있어야 합니다.

const SHARED_SCHEMA = "kfr";
const STORAGE_BUCKET = "cafe";
// 영업일 기준 시간대: 사장님이 한국에서 보더라도 '오늘'은 필리핀 매장 기준
const STORE_TZ = "Asia/Manila";
// 로고: 받으면 파일을 저장소에 올리고 경로를 넣으세요 (예: "logo.png"). 비우면 글자 로고.
const LOGO = "";
// ════════════════════════════════════════════════════════

const PESO = "₱";
const fmt = (n) => PESO + (Number(n) || 0).toLocaleString("en-PH");

const timeHM = (ts) => ts ? new Date(ts).toLocaleTimeString("en-GB", { timeZone: STORE_TZ, hour:"2-digit", minute:"2-digit" }) : "—";

let sb = null, sbk = null;
const state = { user:null, employees:[], settings:{}, tab:null, lang:(localStorage.getItem("cafe_lang")||"en") };

// ── 다국어: ko / en(+tl 병기) ──

  system_name:{ko:"카페 관리 시스템",en:"Cafe Management",tl:"Pamamahala ng Cafe"},
  employee:{ko:"직원",en:"Employee",tl:"Empleyado"},
  pin:{ko:"PIN 번호",en:"PIN",tl:"PIN number"},

  err_no_account:{ko:"계정을 찾을 수 없습니다.",en:"Account not found / Hindi mahanap ang account."},
  err_bad_pin:{ko:"PIN이 올바르지 않습니다.",en:"Incorrect PIN / Maling PIN."},
  role_ADMIN:{ko:"사장",en:"Owner"},
  role_STAFF:{ko:"직원",en:"Staff"},
  tab_dashboard:{ko:"대시보드",en:"Dashboard"},
  tab_clock:{ko:"출퇴근",en:"Time Clock"},
  tab_inventory:{ko:"재고",en:"Inventory"},
  tab_board:{ko:"게시판",en:"Board"},
  tab_closing:{ko:"마감",en:"Closing"},
  tab_daily:{ko:"일별 매출",en:"Daily Sales"},
  tab_menurank:{ko:"메뉴 순위",en:"Menu Ranking"},
  tab_report:{ko:"월별 보고서",en:"Monthly Report"},
  tab_attendance:{ko:"근태",en:"Attendance"},
  tab_supply:{ko:"공급요청",en:"Supply Requests"},
  tab_manage:{ko:"관리",en:"Settings"},
  coming_soon:{ko:"준비 중인 화면입니다",en:"Coming soon",tl:"Malapit na"},
  save:{ko:"저장",en:"Save",tl:"I-save"},
  saved:{ko:"저장되었습니다",en:"Saved / Na-save"},
  save_fail:{ko:"저장 실패: ",en:"Save failed: "},
};
function tt(k){ const e=I18N[k]; if(!e) return k; return state.lang==="ko" ? (e.ko??k) : (e.en??k); }
function tl(k){ const e=I18N[k]; if(!e) return k; if(state.lang==="ko") return e.ko??k; return (e.en??k)+(e.tl?`<span class="lang-sub">${e.tl}</span>`:""); }
function langButtons(){ return [["ko","한국어"],["en","English · Tagalog"]].map(([k,l])=>`<button class="${state.lang===k?'on':''}" onclick="setLang('${k}')">${l}</button>`).join(""); }
function setLang(l){ state.lang=l; localStorage.setItem("cafe_lang",l); if(state.user) renderApp(); else renderLogin(); }
const empName = (e) => !e ? "" : (state.lang==="ko" ? e.name : (e.name_en || e.name));
const empById = (id) => state.employees.find((e) => String(e.id) === String(id));
const isAdmin = () => state.user?.role === "ADMIN";

function logoHTML(big){
  if (LOGO) return big ? `<img class="login-logo-img" src="${LOGO}" alt="Bahay Cafe">` : `<img class="topbar-logo" src="${LOGO}" alt="Bahay Cafe">`;
  return big ? `<div class="wordmark"><b>☕ Bahay Cafe</b><small>${tl("system_name")}</small></div>` : `<span class="topbar-mark">☕ Bahay Cafe</span>`;
}
function setupError(msg, e){
  const hint = /schema/i.test(e?.message||"") ? `<br><br>👉 Supabase → Settings → API → <b>Exposed schemas</b> 에 <b>cafe</b>, <b>kfr</b> 가 모두 있는지 확인하세요.` : "";
  $("root").innerHTML = `<div class="login-wrap"><div class="login-card">${logoHTML(true)}<div class="setup-note">${msg}${hint}<br><br>오류: ${esc(e?.message||e)}</div></div></div>`;
}

async function init() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: SUPABASE_SCHEMA } });
  sbk = sb.schema(SHARED_SCHEMA);
  try {
    await loadEmployees();
    await loadSettings();
  } catch (e) {
    setupError("DB 연결은 됐지만 cafe 테이블을 읽지 못했어요. Supabase SQL Editor 에서 <b>supabase/cafe_schema.sql</b> 을 실행했는지 확인해주세요.", e);
    return;
  }
  // 새로고침해도 로그인 유지 (직원 폰 편의). 비활성/삭제된 계정이면 다시 로그인.
  const saved = empById(localStorage.getItem("cafe_user"));
  if (saved && saved.active !== false) { setUser(saved); renderApp(); }
  else renderLogin();
}
async function loadEmployees(){
  // PIN 은 로그인 순간에만 조회 (목록에는 싣지 않음)
  const { data, error } = await sb.from("employees").select("id,name,name_en,role,active").order("id");
  if (error) throw error;
  state.employees = data || [];
}
async function loadSettings(){
  const { data, error } = await sb.from("app_settings").select("key,value");
  if (error) throw error;
  state.settings = Object.fromEntries((data||[]).map((r) => [r.key, r.value]));
}
async function setSetting(key, value){
  state.settings[key] = value;
  return sb.from("app_settings").upsert({ key, value: String(value) });
}
function toast(msg) { const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

// ── 로그인 ──────────────────────────────────────
function renderLogin() {
  const last = localStorage.getItem("cafe_last_emp");
  const opts = state.employees.filter((e) => e.active !== false)
    .map((e) => `<option value="${e.id}" ${String(e.id)===last?"selected":""}>${esc(empName(e))} · ${tt("role_"+e.role)}</option>`).join("");
  $("root").innerHTML = `<div class="login-wrap"><div class="login-card">
    ${logoHTML(true)}
    <div class="lang-toggle" style="justify-content:center;margin-bottom:18px">${langButtons()}</div>
    <div id="loginErr"></div>
    <div class="field"><label for="loginEmp">${tl("employee")}</label><select id="loginEmp">${opts}</select></div>
    <div class="field"><label for="loginPin">${tl("pin")}</label><input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div>
    <button class="btn-primary" onclick="doLogin()">${tl("login")}</button>
  </div></div>`;
  $("loginPin").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
}
async function doLogin() {
  const id = Number($("loginEmp").value), pin = $("loginPin").value.trim();
  const { data, error } = await sb.from("employees").select("id,name,name_en,role,active,pin").eq("id", id).single();
  if (error || !data || data.active === false) { $("loginErr").innerHTML = `<div class="err">${tt("err_no_account")}</div>`; return; }
  if (String(data.pin) !== pin) { $("loginErr").innerHTML = `<div class="err">${tt("err_bad_pin")}</div>`; return; }
  localStorage.setItem("cafe_last_emp", String(id));
  localStorage.setItem("cafe_user", String(id));
  setUser(data);
  renderApp();
}
function setUser(e){
  state.user = { id: e.id, name: e.name, name_en: e.name_en, role: e.role };
  state.tab = tabsFor().some(([k]) => k === state.tab) ? state.tab : tabsFor()[0][0];
}
function logout() { state.user = null; state.tab = null; localStorage.removeItem("cafe_user"); renderLogin(); }

// ── 탭 라우팅 (role 로 분기) ─────────────────────
function tabsFor(){
  if (isAdmin()) return ["dashboard","daily","menurank","report","attendance","inventory","supply","board","manage"].map((k)=>[k,tt("tab_"+k)]);
  const t = ["clock","inventory","board"];
  if (state.settings.staff_closing === "1") t.push("closing");
  return t.map((k)=>[k,tt("tab_"+k)]);
}
function renderApp() {
  const u = state.user;
  $("root").innerHTML = `
    <div class="topbar">
      ${logoHTML(false)}
      <div class="who"><div class="lang-toggle">${langButtons()}</div>
        <div class="who-name">${esc(empName(u))}<small>${tt("role_"+u.role)}</small></div>
        <button class="logout" onclick="logout()">${tt("logout")}</button></div>
    </div>
    <nav class="tabs" role="tablist">${tabsFor().map(([k,l])=>`<button class="tab ${state.tab===k?'on':''}" role="tab" aria-selected="${state.tab===k}" onclick="go('${k}')">${l}</button>`).join("")}</nav>
    <main class="content" id="screen"><div class="loading">${tt("loading")}</div></main>`;
  renderScreen();
}
function go(t) { state.tab = t; renderApp(); }
const SCREENS = {
  dashboard: () => screenDashboard(),
  manage:    () => screenManage(),
  clock:      () => screenSoon("tab_clock", 2, { ko:"사진(실시간 촬영) + GPS + 서버시각으로 출근/퇴근", en:"Clock in/out with live photo + GPS + server time" }),
  attendance: () => screenSoon("tab_attendance", 2, { ko:"직원×날짜 근태표 · 사진 확대 · 매장 거리 · 월 근무시간", en:"Staff × date attendance with photo, distance and monthly hours" }),
  board:      () => screenSoon("tab_board", 3, { ko:"요청/특이사항/수정 글 + 사진 첨부 + 댓글", en:"Requests / issues / fixes with photos and comments" }),
  inventory:  () => screenSoon("tab_inventory", 4, { ko:"현재고 · 입출고 장부 · 저재고 경고 · 주문요청", en:"Stock, in/out ledger, low-stock alerts, order requests" }),
  supply:     () => screenSoon("tab_supply", 5, { ko:"주문요청 승인/반려 → K-Food 주문함(☕카페)으로 연결", en:"Approve / reject requests → sent to K-Food orders" }),
  closing:    () => screenSoon("tab_closing", 6, { ko:"일일 마감(메뉴 수량 · 현금 · GCash)", en:"Daily closing (menu qty, cash, GCash)" }),
  daily:      () => screenSoon("tab_daily", 6, { ko:"일별 매출표", en:"Daily sales table" }),
  menurank:   () => screenSoon("tab_menurank", 6, { ko:"메뉴 판매 순위", en:"Menu sales ranking" }),
  report:     () => screenSoon("tab_report", 6, { ko:"월별 손익 보고서", en:"Monthly P&L report" }),
};
async function renderScreen() {
  try { await (SCREENS[state.tab] || SCREENS[tabsFor()[0][0]])(); }
  catch (e) { $("screen").innerHTML = `<div class="err">${esc(e.message||e)}</div>`; }
}
function screenSoon(tabKey, step, desc){
  $("screen").innerHTML = `<div class="report-title">${tt(tabKey)}</div>
    <div class="card"><div class="soon">🛠 ${tl("coming_soon")}<br><b>${esc(desc[state.lang==="ko"?"ko":"en"])}</b><br><span class="muted">Build step ${step}</span></div></div>`;
}

// ── 대시보드 (사장 첫 화면) ──────────────────────
async function screenDashboard(){
  const d = today();
  const [att, inv, notes, close, sup] = await Promise.all([
    sb.from("attendance").select("employee_id,clock_in,clock_out,verified,distance_m").eq("date", d),
    sb.from("inventory_items").select("id,name,name_en,unit,stock,reorder_level").eq("active", true),
    sb.from("notes").select("id,title,category,author_employee_id,created_at", { count:"exact" }).eq("resolved", false).order("id", { ascending:false }).limit(5),
    sb.from("closings").select("cash,gcash").eq("date", d).maybeSingle(),
    sbk.from("supply_requests").select("id", { count:"exact", head:true }).eq("source","CAFE").eq("status","PENDING"),
  ]);
  const working = (att.data||[]).filter((a) => a.clock_in && !a.clock_out);
  const low = (inv.data||[]).filter((i) => Number(i.stock) < Number(i.reorder_level));
  const sales = close.data ? Number(close.data.cash||0) + Number(close.data.gcash||0) : null;
  const ko = state.lang === "ko";
  const workingTxt = working.map((a) => `${esc(empName(empById(a.employee_id)))} ${timeHM(a.clock_in)}${a.verified?" ✅":" ⚠️"}`).join("<br>");
  const lowTxt = low.slice(0,4).map((i) => `${esc(ko?i.name:(i.name_en||i.name))} ${Number(i.stock)}/${Number(i.reorder_level)}${esc(i.unit||"")}`).join("<br>");
  const supErr = sup.error ? `<div class="setup-note">⚠️ K-Food 공용 테이블(kfr.supply_requests)을 읽지 못했어요: ${esc(sup.error.message)}</div>` : "";
  const feed = (notes.data||[]).map((n) => `<div class="feed-row"><span class="muted">${new Date(n.created_at).toLocaleDateString("en-CA",{timeZone:STORE_TZ}).slice(5)}</span><div><b>${esc(n.title||"(제목 없음)")}</b><div class="muted">${esc(empName(empById(n.author_employee_id)))}</div></div></div>`).join("");
  $("screen").innerHTML = `<div class="report-title">${ko?"오늘의 매장":"Today at the cafe"} <span>· ${d}</span></div>
    ${supErr}
    <div class="kpi-row four">
      <div class="kpi accent"><div class="kpi-label">${ko?"오늘 매출":"Today's sales"}</div><div class="kpi-value">${sales===null?"—":fmt(sales)}</div><div class="delta flat">${sales===null?(ko?"마감 전":"Not closed yet"):(ko?"마감 완료":"Closed")}</div></div>
      <div class="kpi"><div class="kpi-label">${ko?"근무 중":"Working now"}</div><div class="kpi-value">${working.length}</div><div class="kpi-sub">${workingTxt}</div></div>
      <div class="kpi ${low.length?"alert":""}"><div class="kpi-label">${ko?"저재고":"Low stock"}</div><div class="kpi-value">${low.length}</div><div class="kpi-sub">${lowTxt}</div></div>
      <div class="kpi ${sup.count?"alert":""}"><div class="kpi-label">${ko?"승인 대기":"Pending approval"}</div><div class="kpi-value">${sup.error?"—":(sup.count||0)}</div><div class="kpi-sub">${ko?"☕ 공급요청":"☕ Supply requests"}</div></div>
    </div>
    <div class="card"><div class="card-head"><h2>${ko?"게시판 · 미해결":"Board · Open"}${notes.count?`<span class="dot-red">${notes.count}</span>`:""}</h2><button class="btn-mini" onclick="go('board')">${ko?"전체 보기":"View all"} →</button></div>
      ${feed || `<p class="empty">${ko?"미해결 글이 없습니다.":"No open posts."}</p>`}</div>`;
}

// ── 관리: 직원 · 매장 좌표 ───────────────────────
async function screenManage(){
  await loadEmployees();
  const ko = state.lang === "ko";
  const rows = state.employees.map((e) => `<div class="emp-row ${e.active===false?"off":""}">
      <div><b>${esc(e.name)}</b>${e.name_en?`<span class="m-en">${esc(e.name_en)}</span>`:""}</div>
      <select aria-label="role" onchange="updateEmployee(${e.id},'role',this.value)">
        ${["STAFF","ADMIN"].map((r)=>`<option value="${r}" ${e.role===r?"selected":""}>${tt("role_"+r)}</option>`).join("")}</select>
      <input type="password" inputmode="numeric" placeholder="${ko?"새 PIN":"New PIN"}" aria-label="PIN" onchange="updateEmployee(${e.id},'pin',this.value)">
      <button class="mng-del" onclick="updateEmployee(${e.id},'active',${e.active===false})">${e.active===false?(ko?"복구":"Restore"):(ko?"비활성":"Disable")}</button>
    </div>`).join("");
  const s = state.settings;
  const hasStore = s.store_lat && s.store_lng;
  $("screen").innerHTML = `<div class="report-title">${tt("tab_manage")}</div>
    <div class="grid-2">
      <div class="card"><h2>${ko?"직원":"Employees"}</h2>
        <div class="add-form">
          <input id="empName" placeholder="${ko?"이름":"Name"}">
          <input id="empNameEn" placeholder="${ko?"영문 이름":"English name"}">
          <input id="empPin" type="password" inputmode="numeric" placeholder="PIN" style="max-width:90px">
          <select id="empRole"><option value="STAFF">${tt("role_STAFF")}</option><option value="ADMIN">${tt("role_ADMIN")}</option></select>
          <button class="btn-mini" onclick="addEmployee()">${ko?"추가":"Add"}</button>
        </div>
        ${rows || `<p class="empty">—</p>`}
        <p class="hint">${ko?"PIN 칸에 새 번호를 입력하고 칸을 벗어나면 저장됩니다. 퇴사자는 삭제 대신 '비활성'(근태 기록 보존).":"Type a new PIN and leave the box to save. Disable instead of deleting to keep attendance history."}</p>
      </div>
      <div class="card sticky"><h2>${ko?"매장 위치 (출근 지오펜스)":"Store location (geofence)"}</h2>
        <div class="kv"><span>${ko?"매장 좌표":"Store coordinates"}</span><b>${hasStore?`${Number(s.store_lat).toFixed(5)}, ${Number(s.store_lng).toFixed(5)}`:(ko?"미등록":"Not set")}</b></div>
        <div class="kv"><span>${ko?"허용 반경":"Allowed radius"}</span><span><input id="geofence" type="number" min="10" step="10" value="${esc(s.geofence_m||100)}" style="width:80px;border:1px solid #D8CDBD;border-radius:7px;padding:6px 8px;text-align:right"> m</span></div>
        <button class="btn-primary" onclick="registerStoreLocation()">📍 ${ko?"지금 위치를 매장 좌표로 등록":"Use my current location as the store"}</button>
        <p class="hint">${ko?"매장 안에서 한 번 눌러 주세요. 출근 시 이 좌표와의 거리로 '매장 출근'을 확인합니다.":"Press this once while inside the cafe. Clock-ins are checked against this point."}</p>
        <div class="kv" style="margin-top:14px"><span>${ko?"직원 마감 입력 허용":"Staff can enter closing"}</span>
          <input type="checkbox" ${s.staff_closing==="1"?"checked":""} onchange="setSetting('staff_closing', this.checked?'1':'0').then(()=>toast(tt('saved')))" style="width:22px;height:22px"></div>
      </div>
    </div>`;
  $("geofence").addEventListener("change", async (e) => {
    const v = Math.max(10, Number(e.target.value) || 100);
    const { error } = await setSetting("geofence_m", v);
    toast(error ? tt("save_fail") + error.message : tt("saved"));
  });
}
async function addEmployee(){
  const name = $("empName").value.trim(), name_en = $("empNameEn").value.trim() || null, pin = $("empPin").value.trim(), role = $("empRole").value;
  if (!name || !/^\d{4,8}$/.test(pin)) { toast(state.lang==="ko" ? "이름과 4~8자리 숫자 PIN을 입력하세요" : "Enter a name and a 4–8 digit PIN"); return; }
  const { error } = await sb.from("employees").insert({ name, name_en, pin, role });
  if (error) { toast(tt("save_fail") + error.message); return; }
  toast(tt("saved")); screenManage();
}
async function updateEmployee(id, field, value){
  if (field === "pin") { value = String(value).trim(); if (!/^\d{4,8}$/.test(value)) { toast(state.lang==="ko" ? "PIN은 4~8자리 숫자" : "PIN must be 4–8 digits"); return; } }
  if (field === "role" || field === "active") {
    // 마지막 활성 사장 계정은 강등/비활성 불가 (잠김 방지)
    const admins = state.employees.filter((e) => e.role === "ADMIN" && e.active !== false);
    const target = empById(id);
    const losesAdmin = target?.role === "ADMIN" && target.active !== false && ((field === "role" && value !== "ADMIN") || (field === "active" && value === false));
    if (losesAdmin && admins.length <= 1) { toast(state.lang==="ko" ? "마지막 사장 계정은 바꿀 수 없습니다" : "Can't remove the last owner account"); screenManage(); return; }
  }
  const { error } = await sb.from("employees").update({ [field]: value }).eq("id", id);
  if (error) { toast(tt("save_fail") + error.message); return; }
  toast(tt("saved"));
  if (String(id) === String(state.user.id) && field === "role") { state.user.role = value; await loadEmployees(); setUser(state.user); renderApp(); return; }
  screenManage();
}
function getPosition(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("GPS not supported"));
    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  });
}
async function registerStoreLocation(){
  const ko = state.lang === "ko";
  try {
    const p = await getPosition();
    const { latitude:lat, longitude:lng, accuracy } = p.coords;
    if (!confirm(`${ko?"이 위치를 매장 좌표로 등록할까요?":"Save this as the store location?"}\n${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(accuracy)}m)`)) return;
    const r = await Promise.all([setSetting("store_lat", lat), setSetting("store_lng", lng)]);
    const err = r.find((x) => x.error)?.error;
    toast(err ? tt("save_fail") + err.message : tt("saved"));
    screenManage();
  } catch (e) { toast((ko?"위치를 가져오지 못했어요: ":"Couldn't get location: ") + (e.message||e)); }
}

init();
</script>
</body>
</html>
